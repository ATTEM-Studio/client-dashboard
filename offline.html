<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#3182F6" />
<title>연결 확인 · 그리온 업체관리</title>
<style>
  *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#F2F4F6;color:#191F28;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}.card{width:min(100%,420px);padding:32px 26px;border-radius:24px;background:#fff;box-shadow:0 14px 40px rgba(25,31,40,.1);text-align:center}.mark{display:grid;place-items:center;width:52px;height:52px;margin:0 auto 20px;border-radius:17px;background:linear-gradient(135deg,#3182F6,#1B64DA);color:#fff;font-size:25px;font-weight:900}h1{margin:0 0 10px;font-size:22px}p{margin:0;color:#6B7684;font-size:14px;line-height:1.65}button{margin-top:22px;border:0;border-radius:12px;padding:12px 18px;background:#3182F6;color:#fff;font:inherit;font-weight:800;cursor:pointer}
</style>
</head>
<body>
<main class="card">
  <div class="mark">G</div>
  <h1>네트워크 연결을 확인해 주세요</h1>
  <p>업체 정보는 안전을 위해 기기에 오프라인 저장하지 않습니다. 연결이 복구되면 다시 시도해 주세요.</p>
  <button type="button" onclick="location.reload()">다시 시도</button>
</main>
</body>
</html>
