<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>업체 관리 대시보드</title>
<style>
  :root{
    --bg-page:#F2F4F6;
    --bg-card:#FFFFFF;
    --ink-900:#191F28;
    --ink-700:#333D4B;
    --ink-600:#4E5968;
    --ink-500:#6B7684;
    --ink-400:#8B95A1;
    --ink-300:#B0B8C1;
    --line:#E5E8EB;
    --brand:#3182F6;
    --brand-light:#EBF2FE;
    --brand-dark:#1B64DA;
    --keep:#3182F6;   --keep-light:#EBF2FE;
    --fix:#F5A623;    --fix-light:#FFF6E5;
    --stop:#F04452;   --stop-light:#FEECEE;
    --scale:#00C471;  --scale-light:#E6F9F0;
    --radius-lg:20px;
    --radius-md:14px;
    --shadow-card: 0 1px 2px rgba(15,23,42,.05), 0 10px 24px -14px rgba(15,23,42,.16);
    --shadow-pop: 0 8px 28px -8px rgba(15,23,42,.22);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg-page); color:var(--ink-900);
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.5;
  }
  button,input,textarea,select{ font-family:inherit; }
  button{ cursor:pointer; }
  input:focus-visible,textarea:focus-visible,button:focus-visible,select:focus-visible{ outline:2px solid var(--brand); outline-offset:2px; }
  #app{ max-width:920px; margin:0 auto; padding:24px 20px 100px; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; gap:12px; }
  .brand{ display:flex; align-items:center; gap:9px; font-weight:800; font-size:17px; }
  .brand-mark{ width:24px; height:24px; border-radius:8px; background:linear-gradient(135deg,var(--brand),var(--brand-dark)); position:relative; flex:none; }
  .brand-mark::after{ content:""; position:absolute; left:6px; top:11px; width:12px; height:3px; border-radius:2px; background:#fff; box-shadow:0 -5px 0 #fff; }

  .btn{ border:none; border-radius:12px; padding:11px 16px; font-size:14px; font-weight:700; transition:transform .12s, background .15s; white-space:nowrap; }
  .btn:active{ transform:scale(.97); }
  .btn-primary{ background:var(--brand); color:#fff; box-shadow:0 6px 16px -6px rgba(49,130,246,.55); }
  .btn-primary:hover{ background:var(--brand-dark); }
  .btn-ghost{ background:var(--brand-light); color:var(--brand-dark); }
  .btn-plain{ background:#F2F4F6; color:var(--ink-700); }
  .btn-plain:hover{ background:#E9ECEF; }
  .btn-text{ background:none; color:var(--ink-600); padding:8px 6px; }
  .btn-danger{ background:var(--stop-light); color:var(--stop); }
  .btn-danger:hover{ background:#FDDDE1; }
  .btn-sm{ padding:8px 12px; font-size:13px; border-radius:10px; }
  .btn-block{ width:100%; }

  .hero{ margin-bottom:18px; }
  .eyebrow{ font-size:12.5px; font-weight:800; color:var(--brand); margin:0 0 8px; }
  .hero h1{ font-size:25px; font-weight:800; margin:0 0 8px; letter-spacing:-.02em; }
  .hero .sub{ font-size:14px; color:var(--ink-600); margin:0; max-width:580px; }

  /* month bar */
  .monthbar{ display:flex; align-items:center; gap:8px; margin-bottom:16px; }
  .monthbar .mb-label{ font-size:15px; font-weight:800; min-width:110px; text-align:center; }
  .mb-arrow{ border:none; background:var(--bg-card); box-shadow:var(--shadow-card); width:32px; height:32px; border-radius:10px; color:var(--ink-700); font-size:14px; }
  .mb-today{ margin-left:auto; }

  /* stats */
  .stats-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:22px; }
  @media(max-width:700px){ .stats-grid{ grid-template-columns:repeat(2,1fr); } }
  .stat-card{ background:var(--bg-card); border-radius:var(--radius-md); padding:15px 16px; box-shadow:var(--shadow-card); }
  .stat-label{ font-size:12px; font-weight:700; color:var(--ink-400); margin-bottom:7px; }
  .stat-value{ font-size:23px; font-weight:800; letter-spacing:-.01em; }
  .stat-unit{ font-size:13px; font-weight:600; color:var(--ink-400); margin-left:2px; }
  .stat-sub{ font-size:11.5px; color:var(--ink-400); margin-top:5px; }
  .stat-card.accent{ background:linear-gradient(150deg,#1B64DA,#3182F6); color:#fff; }
  .stat-card.accent .stat-label,.stat-card.accent .stat-sub{ color:rgba(255,255,255,.8); }
  .stat-card.accent .stat-unit{ color:rgba(255,255,255,.75); }

  .progress-track{ height:5px; border-radius:99px; background:rgba(255,255,255,.28); margin-top:9px; overflow:hidden; }
  .progress-fill{ height:100%; border-radius:99px; background:#fff; transition:width .5s ease; }

  /* section head */
  .sec-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px; }
  .sec-head h2{ font-size:16px; margin:0; }
  .sec-head .count{ font-size:13px; color:var(--ink-400); font-weight:600; }

  /* client card */
  .client-card{ background:var(--bg-card); border-radius:var(--radius-md); padding:16px 18px; box-shadow:var(--shadow-card); margin-bottom:10px; transition:box-shadow .15s, transform .12s; }
  .client-card:hover{ box-shadow:var(--shadow-pop); transform:translateY(-1px); }
  .cc-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .cc-name{ font-weight:800; font-size:15.5px; display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
  .cc-meta{ font-size:12.5px; color:var(--ink-400); margin-top:4px; }
  .cc-arrow{ color:var(--ink-300); font-size:18px; flex:none; }

  .tag{ font-size:10.5px; font-weight:800; padding:2px 8px; border-radius:6px; }
  .tag-new{ background:var(--scale-light); color:#0B8F55; }
  .tag-renew{ background:var(--brand-light); color:var(--brand-dark); }
  .tag-paused{ background:#F2F4F6; color:var(--ink-500); }
  .tag-ended{ background:var(--stop-light); color:var(--stop); }
  .tag-soon{ background:var(--fix-light); color:#B6790C; }

  /* week strip */
  .week-strip{ display:flex; gap:6px; margin-top:12px; }
  .day-progress{ margin-top:14px; }
  .day-progress-copy{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:8px; }
  .day-progress-copy strong{ font-size:12.5px; color:var(--brand-dark); }
  .day-progress-copy span{ font-size:11.5px; color:var(--ink-400); white-space:nowrap; }
  .day-progress-track{ height:12px; border-radius:99px; background:#EEF1F5; overflow:hidden; }
  .day-progress-fill{ height:100%; border-radius:inherit; background:linear-gradient(90deg,var(--brand-dark),var(--brand)); transition:width .5s ease; }
  .day-progress-weeks{ display:grid; grid-template-columns:7fr 7fr 7fr 7fr 2fr; margin-top:6px; font-size:10.5px; color:var(--ink-400); text-align:center; }
  .day-progress-weeks span{ display:block; }
  .day-progress-weeks small{ display:block; margin-top:1px; font-size:9px; color:var(--ink-300); }
  @media(max-width:420px){ .day-progress-copy{ align-items:flex-start; flex-direction:column; gap:2px; } }
  .week-cell{ flex:1; border:none; border-radius:9px; padding:8px 4px 7px; background:#F2F4F6; text-align:center; transition:background .15s, transform .1s; }
  .week-cell:active{ transform:scale(.96); }
  .wc-label{ font-size:10.5px; font-weight:800; color:var(--ink-400); display:block; }
  .wc-state{ font-size:11px; font-weight:700; color:var(--ink-300); display:block; margin-top:2px; }
  .week-cell.doing{ background:var(--fix-light); }
  .week-cell.doing .wc-label,.week-cell.doing .wc-state{ color:#B6790C; }
  .week-cell.done{ background:var(--scale-light); }
  .week-cell.done .wc-label,.week-cell.done .wc-state{ color:#0B8F55; }
  .week-cell.current{ box-shadow:inset 0 0 0 2px var(--brand); }

  .empty-state{ background:var(--bg-card); border:1.5px dashed var(--line); border-radius:var(--radius-lg); padding:38px 24px; text-align:center; }
  .es-title{ font-weight:800; font-size:15.5px; margin-bottom:6px; }
  .es-sub{ font-size:13.5px; color:var(--ink-500); margin-bottom:18px; }
  .es-actions{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }

  #toast{ position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px); background:var(--ink-900); color:#fff; font-size:13.5px; font-weight:600; padding:12px 18px; border-radius:12px; box-shadow:var(--shadow-pop); opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:90; }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* modal */
  #modal-layer{ position:fixed; inset:0; background:rgba(15,23,42,.42); display:none; align-items:center; justify-content:center; padding:20px; z-index:100; }
  #modal-layer.show{ display:flex; }
  #modal-layer.client-info-modal .modal{ max-width:460px; }
  #modal-layer.client-info-modal #modal-body{ white-space:normal; }
  .client-info-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin:6px 0 18px; }
  .client-info-item{ padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:#FAFBFC; }
  .client-info-label{ display:block; color:var(--ink-400); font-size:11px; margin-bottom:4px; }
  .client-info-value{ display:block; color:var(--ink-700); font-size:13px; font-weight:700; word-break:break-word; }
  .client-status-table{ display:grid; gap:6px; max-height:420px; overflow:auto; margin:6px 0 18px; }
  .client-status-row{ display:grid; grid-template-columns:minmax(0,1.4fr) .9fr .9fr .8fr; gap:8px; align-items:center; padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; font-size:12px; }
  .client-status-row.season{ background:#FFF7E8; border-color:#F4C36A; }
  .client-status-row.complete{ background:#ECFDF5; border-color:#6EE7B7; }
  .client-status-row.overdue{ background:#FFF1F2; border-color:#FDA4AF; }
  .client-status-row button{ border:0; background:transparent; color:var(--brand-dark); font-weight:800; text-align:left; padding:0; cursor:pointer; }
  .client-status-head{ color:var(--ink-400); font-size:10.5px; font-weight:700; }
  .client-status-badge{ font-size:10.5px; font-weight:800; }
  @media(max-width:560px){ .client-status-row{ grid-template-columns:1.3fr .9fr .9fr; } .client-status-row .client-status-badge{ grid-column:1 / -1; } }
  @media(max-width:520px){ .client-info-grid{ grid-template-columns:1fr; } }
  #renewal-modal{ position:fixed; inset:0; background:rgba(15,23,42,.42); display:none; align-items:center; justify-content:center; padding:20px; z-index:105; }
  #renewal-modal.show{ display:flex; }
  #renewal-set-options{ display:grid; gap:8px; margin:0 0 18px; }
  #renewal-set-options button{ border:1px solid var(--line); background:#fff; border-radius:10px; padding:11px 12px; text-align:left; font-weight:700; }
  #renewal-set-options button.active{ border-color:var(--brand); background:var(--brand-light); color:var(--brand-dark); }
  .modal{ background:#fff; border-radius:18px; padding:24px 22px 18px; max-width:360px; width:100%; box-shadow:var(--shadow-pop); }
  .modal h3{ margin:0 0 8px; font-size:16.5px; }
  .modal p{ margin:0 0 20px; font-size:13.5px; color:var(--ink-600); line-height:1.6; }
  .modal-actions{ display:flex; gap:8px; justify-content:flex-end; }

  /* forms */
  .form-card{ background:var(--bg-card); border-radius:var(--radius-lg); box-shadow:var(--shadow-card); overflow:hidden; }
  .fsection{ padding:24px; border-bottom:1px solid var(--line); }
  .fsection:last-of-type{ border-bottom:none; }
  .fsec-num{ font-size:11.5px; font-weight:800; color:var(--brand); letter-spacing:.06em; margin-bottom:4px; }
  .fsec-title{ font-size:16px; font-weight:800; margin:0 0 4px; }
  .fsec-hint{ font-size:12.5px; color:var(--ink-400); margin:0 0 14px; }
  .revenue-form-section{ background:linear-gradient(180deg,#F8FBFF,#fff); }
  .optional-label{ display:inline-flex; align-items:center; margin-left:6px; padding:2px 7px; border-radius:999px; background:var(--brand-light); color:var(--brand-dark); font-size:10.5px; font-weight:800; vertical-align:2px; }
  .revenue-auto{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; padding:12px 14px; border:1px solid #DCE8FB; border-radius:11px; background:#F5F9FF; color:var(--ink-600); font-size:12.5px; }
  .revenue-auto strong{ color:var(--brand-dark); font-size:14px; }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:12.5px; font-weight:700; color:var(--ink-600); margin-bottom:6px; }
  .field input[type=text],.field input[type=date],.field textarea,.field select{ width:100%; border:1px solid var(--line); border-radius:10px; padding:11px 13px; font-size:14px; color:var(--ink-900); background:#FAFBFC; resize:vertical; }
  .field input::placeholder,.field textarea::placeholder{ color:var(--ink-300); }
  .two-col{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media(max-width:640px){ .two-col{ grid-template-columns:1fr; } }
  .form-actions{ display:flex; justify-content:flex-end; gap:10px; padding:20px 24px 24px; }

  .seg{ display:inline-flex; background:#F2F4F6; border-radius:11px; padding:3px; }
  .seg button{ border:none; background:transparent; padding:9px 16px; font-size:13px; font-weight:700; border-radius:9px; color:var(--ink-500); }
  .seg button.active{ background:#fff; color:var(--ink-900); box-shadow:0 1px 4px rgba(15,23,42,.1); }

  .type-toggle{ display:inline-flex; background:var(--bg-card); border-radius:12px; box-shadow:var(--shadow-card); padding:4px; margin-bottom:18px; }
  .type-toggle button{ border:none; background:transparent; padding:9px 18px; font-size:13px; font-weight:800; border-radius:9px; color:var(--ink-400); }
  .type-toggle button.active{ background:var(--brand); color:#fff; }

  .row{ display:flex; gap:8px; margin-bottom:8px; align-items:center; }
  .row-input{ flex:1; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:13.5px; background:#FAFBFC; }
  .row-remove{ flex:none; width:32px; height:32px; border:none; background:#F2F4F6; color:var(--ink-400); border-radius:9px; font-size:14px; }
  .row-remove:hover{ background:var(--stop-light); color:var(--stop); }
  .add-row-btn{ margin-top:2px; border:1px dashed var(--line); background:transparent; color:var(--ink-600); border-radius:10px; padding:9px 12px; font-size:13px; font-weight:700; width:100%; text-align:left; }
  .add-row-btn:hover{ border-color:var(--brand); color:var(--brand-dark); background:var(--brand-light); }

  .metric-row{ display:grid; grid-template-columns:1.3fr 1fr .7fr 1fr 1fr 32px; gap:8px; margin-bottom:8px; align-items:center; }
  .metric-row input{ border:1px solid var(--line); border-radius:10px; padding:10px 11px; font-size:13px; background:#FAFBFC; width:100%; }
  @media(max-width:720px){ .metric-row{ grid-template-columns:1fr 1fr; } .metric-row .row-remove{ grid-column:span 2; width:100%; } }

  .channel-quickadd{ display:flex; flex-wrap:wrap; gap:7px; margin-bottom:14px; }
  .qa-chip{ border:1px dashed var(--line); background:#fff; color:var(--ink-600); font-size:12.5px; font-weight:700; padding:7px 12px; border-radius:999px; }
  .qa-chip:hover{ border-color:var(--brand); color:var(--brand-dark); background:var(--brand-light); }
  .channel-block{ border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:10px; background:#FAFBFC; }
  .channel-block-head{ display:flex; gap:8px; margin-bottom:10px; align-items:center; }
  .channel-name{ flex:1; border:1px solid var(--line); border-radius:10px; padding:9px 12px; font-size:13.5px; font-weight:800; background:#fff; }

  .subgroup{ background:#FAFBFC; border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px; }
  .subgroup-title{ display:flex; align-items:center; gap:8px; font-size:13px; font-weight:800; margin-bottom:10px; }
  .dot{ width:9px; height:9px; border-radius:3px; display:inline-block; }
  .dot-keep{ background:var(--keep); } .dot-fix{ background:var(--fix); } .dot-stop{ background:var(--stop); } .dot-scale{ background:var(--scale); }

  /* client detail */
  .detail-head{ background:linear-gradient(160deg,#1B64DA,#3182F6 55%,#5B9CFB); border-radius:var(--radius-lg); padding:24px 24px 20px; color:#fff; margin-bottom:16px; position:relative; overflow:hidden; }
  .detail-head::after{ content:""; position:absolute; right:-40px; top:-40px; width:180px; height:180px; border-radius:50%; background:rgba(255,255,255,.08); }
  .dh-name{ font-size:21px; font-weight:800; margin:0 0 6px; position:relative; }
  .dh-meta{ font-size:13px; opacity:.88; position:relative; display:flex; flex-wrap:wrap; gap:12px; }
  .dh-tagrow{ margin-bottom:10px; display:flex; gap:6px; position:relative; }
  .status-pill{ display:inline-block; font-size:11px; font-weight:800; padding:3px 9px; border-radius:999px; background:rgba(255,255,255,.2); color:#fff; }

  .panel{ background:var(--bg-card); border-radius:var(--radius-lg); box-shadow:var(--shadow-card); padding:20px 22px; margin-bottom:14px; }
  .panel-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px; }
  .panel-title{ font-size:15px; font-weight:800; margin:0; }
  .panel-hint{ font-size:12px; color:var(--ink-400); margin:4px 0 12px; }

  /* checklist */
  .check-row{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); }
  .check-row:last-child{ border-bottom:none; }
  .check-box{ flex:none; width:20px; height:20px; border-radius:7px; border:1.5px solid var(--ink-300); background:#fff; color:transparent; font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center; padding:0; }
  .check-box.on{ background:var(--brand); border-color:var(--brand); color:#fff; }
  .check-text{ flex:1; font-size:14px; color:var(--ink-700); }
  .check-row.done .check-text{ color:var(--ink-300); text-decoration:line-through; }
  .check-week{ font-size:10.5px; font-weight:800; color:var(--ink-400); background:#F2F4F6; padding:2px 7px; border-radius:6px; flex:none; }
  .check-del{ flex:none; width:26px; height:26px; border:none; background:transparent; color:var(--ink-300); border-radius:7px; font-size:13px; }
  .check-del:hover{ background:var(--stop-light); color:var(--stop); }
  .check-add{ display:flex; gap:8px; margin-top:12px; }
  .check-add input{ flex:1; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:13.5px; background:#FAFBFC; }
  .check-add select{ flex:none; width:88px; border:1px solid var(--line); border-radius:10px; padding:10px 8px; font-size:13px; background:#FAFBFC; }
  .check-section{ border:1px solid var(--line); border-radius:14px; margin-bottom:10px; overflow:hidden; background:#fff; }
  .check-section-head{ width:100%; border:0; background:#FAFBFC; padding:12px 13px; display:flex; align-items:center; justify-content:space-between; gap:10px; text-align:left; cursor:pointer; }
  .check-section-title{ display:flex; align-items:center; gap:8px; font-size:14px; font-weight:800; color:var(--ink-700); }
  .check-section-arrow{ color:var(--ink-400); font-size:12px; transition:transform .18s ease; }
  .check-section-head[aria-expanded="true"] .check-section-arrow{ transform:rotate(90deg); }
  .check-section-count{ font-size:12px; font-weight:800; color:var(--ink-400); }
  .check-section-body{ padding:0 13px 3px; }
  .check-section-empty{ padding:13px; font-size:13px; color:var(--ink-400); }
  .top-actions{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
  .contract-card{ border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:10px; background:#fff; }
  .contract-card h4{ margin:0 0 4px; font-size:14px; }
  .contract-meta{ font-size:12.5px; color:var(--ink-400); display:flex; gap:8px; flex-wrap:wrap; }
  .contract-actions{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .signature-box{ border:1.5px dashed var(--line); border-radius:14px; background:#FAFBFC; padding:10px; }
  .signature-canvas{ width:100%; height:160px; display:block; border-radius:10px; background:#fff; touch-action:none; }
  .signature-preview{ max-width:100%; height:90px; object-fit:contain; border:1px solid var(--line); border-radius:10px; background:#fff; margin-top:8px; }
  .contract-signed-preview{ display:block; width:100%; max-height:150px; object-fit:contain; border:1px solid var(--line); border-radius:14px; background:#fff; padding:10px; margin-top:10px; }
  .contract-signed-status{ display:inline-flex; align-items:center; gap:6px; color:#0B8F55; background:var(--scale-light); border-radius:999px; padding:6px 10px; font-size:12px; font-weight:800; }

  /* report rows in detail */
  .report-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 0; border-bottom:1px solid var(--line); }
  .report-row:last-child{ border-bottom:none; }
  .rr-main{ flex:1; cursor:pointer; }
  .rr-title{ font-size:14px; font-weight:700; display:flex; align-items:center; gap:7px; }
  .rr-date{ font-size:12px; color:var(--ink-400); margin-top:3px; }
  .rr-actions{ display:flex; gap:6px; flex:none; }

  .guide-question input[type=text],.guide-question textarea{ width:100%; border:1px solid var(--line); border-radius:12px; padding:12px 13px; background:#FAFBFC; color:var(--ink-900); font-size:14px; resize:vertical; }

  .guide-radio input:checked + span{ border-color:var(--brand); background:var(--brand-light); color:var(--brand-dark); box-shadow:inset 0 0 0 1px var(--brand); }

  .guide-save-row{ min-height:42px; display:flex; align-items:center; justify-content:center; gap:9px; padding:4px 20px 8px; color:var(--ink-400); font-size:12px; font-weight:700; text-align:center; }
  .guide-save-row[data-state="saving"]{ color:var(--brand-dark); }
  .guide-save-row[data-state="saved"]{ color:#0B8F55; }
  .guide-save-row[data-state="failed"]{ color:var(--stop); }
  .guide-retry{ border:0; border-radius:8px; padding:6px 9px; background:var(--stop-light); color:var(--stop); font-size:11.5px; font-weight:800; }
  .contract-readonly-card{ display:grid; gap:10px; padding:16px; border:1px solid rgba(229,232,235,.95); border-radius:18px; background:linear-gradient(180deg,#fff,#FAFBFF); box-shadow:0 10px 24px rgba(25,31,40,.05); }
  .contract-readonly-row{ display:flex; justify-content:space-between; gap:14px; padding:11px 0; border-bottom:1px solid rgba(229,232,235,.72); }
  .contract-readonly-row:last-child{ border-bottom:0; }
  .contract-readonly-label{ color:var(--ink-500); font-size:12.5px; font-weight:800; }
  .contract-readonly-value{ max-width:68%; color:var(--ink); font-size:14px; font-weight:800; text-align:right; line-height:1.45; white-space:pre-wrap; }
  .contract-readonly-terms{ margin-top:12px; padding:15px; border-radius:16px; background:#F8FAFC; color:var(--ink-700); font-size:13px; line-height:1.7; white-space:pre-wrap; }
  .contract-public-inputs{ margin-top:16px; padding-top:6px; }
  .guide-actions{ position:sticky; bottom:0; display:flex; gap:9px; padding:14px 20px 20px; border-top:1px solid var(--line); background:rgba(255,255,255,.96); backdrop-filter:blur(10px); }
  .guide-actions .btn{ flex:1; }
  .guide-complete{ padding:48px 24px 28px; border-radius:20px; background:var(--bg-card); box-shadow:var(--shadow-card); text-align:center; }
  .guide-complete-icon{ width:54px; height:54px; display:grid; place-items:center; margin:0 auto 18px; border-radius:50%; background:var(--scale-light); color:#0B8F55; font-size:25px; font-weight:900; }
  .guide-complete h1{ margin:0 0 8px; font-size:24px; }
  .guide-complete-copy{ max-width:400px; margin:0 auto 22px; color:var(--ink-600); font-size:14px; line-height:1.7; }
  .guide-complete-summary{ margin:0 0 20px; padding:14px 15px; border-radius:13px; background:#F7F9FC; text-align:left; }
  .guide-complete-summary div{ padding:5px 0; color:var(--ink-600); font-size:12.5px; }
  .guide-complete-summary strong{ display:block; color:var(--ink-900); font-size:11.5px; }
  .guide-complete-note{ margin:0 0 18px; color:var(--ink-400); font-size:12px; }
  @media(max-width:600px){
    #app:has(.public-guide){ padding:18px 14px 60px; }
    .public-guide-head{ padding-top:4px; }
    .public-guide-head h1{ font-size:23px; }
    .guide-section{ padding:22px 17px 6px; }
    .guide-actions{ padding:13px 17px 17px; }
  }
  @media(max-width:380px){ .guide-radio-group{ grid-template-columns:1fr; } }

  @media (prefers-reduced-motion: reduce){ *{ transition:none!important; animation:none!important; } }
  .fade-in{ animation:fadeIn .3s ease both; }
  @keyframes fadeIn{ from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);} }
</style>

    <button class="btn btn-plain" id="modal-cancel">취소</button>

<div id="renewal-modal">
  <div class="modal">
    <div id="renewal-date-step">
      <h3>재계약 시작일</h3>

      <h3>체크리스트 세트</h3>

      <div id="renewal-set-options"></div>
      <div class="modal-actions"><button class="btn btn-plain" id="btn-back-renewal">이전</button><button class="btn btn-primary" id="btn-confirm-renewal">재계약 시작</button></div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ============ 저장소 (Upstash Redis via /api/data) ============ */
  var AUTH_KEY = "rs:team-token";
  var authToken = null;
  try { authToken = localStorage.getItem(AUTH_KEY); } catch(e) {}

  function authHeaders(){
    return authToken ? { "x-team-token": authToken } : {};
  }

  var storageBackend = {
    async get(key){
      var res = await fetch("/api/data?key=" + encodeURIComponent(key), { headers: authHeaders() });
      if (res.status === 401) { forceLogout(); throw new Error("unauthorized"); }
      if (res.status === 404) {
        var missingError = new Error("Key not found: " + key);
        missingError.code = "not_found";
        throw missingError;
      }
      if (!res.ok) throw new Error("get failed " + res.status);
      var data = await res.json();
      return { key: key, value: data.value };
    },
    async set(key, value){
      var res = await fetch("/api/data", {
        method: "POST",
        headers: Object.assign({ "Content-Type": "application/json" }, authHeaders()),
        body: JSON.stringify({ key: key, value: value })
      });
      if (res.status === 401) { forceLogout(); throw new Error("unauthorized"); }
      if (!res.ok) {
        var e = await res.json().catch(function(){ return {}; });
        throw new Error(e.error || ("set failed " + res.status));
      }
      return { key: key, value: value };
    },
    async reserveGuideIssue(clientId){
      var res = await fetch("/api/data", {
        method: "POST",
        headers: Object.assign({ "Content-Type": "application/json" }, authHeaders()),
        body: JSON.stringify({ operation: "reserve-guide-issue", clientId: clientId })
      });
      if (res.status === 401) { forceLogout(); throw new Error("unauthorized"); }
      if (!res.ok) {
        var e = await res.json().catch(function(){ return {}; });
        throw new Error(e.error || ("guide reservation failed " + res.status));
      }
      var data = await res.json();
      return data.reservation || null;
    },
    async mutatePublicGuide(guideId, answers, submitted){
      var res = await fetch("/api/guide?id=" + encodeURIComponent(guideId) + "&action=" + (submitted ? "submit" : "save"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ answers: answers })
      });
      if (!res.ok) {
        var e = await res.json().catch(function(){ return {}; });
        throw new Error(e.error || ("public guide save failed " + res.status));
      }
      var data = await res.json();
      return data.guide || null;
    },
    async getPublicGuide(guideId){
      var res = await fetch("/api/guide?id=" + encodeURIComponent(guideId), { headers: authHeaders(), cache: "no-store" });
      if (res.status === 404) { var missing = new Error("guide not found"); missing.code = "not_found"; throw missing; }
      if (!res.ok) throw new Error("guide get failed " + res.status);
      var data = await res.json();
      return data.value ? JSON.parse(data.value) : (data.guide || null);
    },
    async mutatePublicContract(contractId, contract, submitted){
      var res = await fetch("/api/data", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          operation: submitted ? "submit-public-contract" : "save-public-contract",
          contractId: contractId,
          contract: contract
        })
      });
      if (!res.ok) {
        var e = await res.json().catch(function(){ return {}; });
        throw new Error(e.error || ("public contract save failed " + res.status));
      }
      var data = await res.json();
      return data.contract || null;
    },
    async delete(key){
      var res = await fetch("/api/data?key=" + encodeURIComponent(key), {
        method: "DELETE", headers: authHeaders()
      });
      if (res.status === 401) { forceLogout(); throw new Error("unauthorized"); }
      if (!res.ok) throw new Error("delete failed " + res.status);
      return { key: key, deleted: true };
    }
  };

  function forceLogout(){
    authToken = null;
    try { localStorage.removeItem(AUTH_KEY); } catch(e) {}
  }

  /* ============ utils ============ */
  function uid(p){ return (p||"id")+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function newGuide(clientId){
    var bytes=new Uint8Array(24);
    crypto.getRandomValues(bytes);
    var id="guide_"+Array.prototype.map.call(bytes,function(byte){return byte.toString(16).padStart(2,"0");}).join("");
    var now=Date.now();
    return {
      id:id, clientId:clientId, createdAt:now, updatedAt:now, submittedAt:null,
      answers:{
        concern:"", goal:"", priorityMenu:"", currentCustomers:"", desiredCustomers:"",
        strengths:"", story:"", contentTone:"", avoidExpressions:"", materialStatus:"",
        approverName:"", approverContact:"", operatingNotes:""
      }
    };
  }
  function newGuideReview(guide){
    return {guideId:guide.id,clientId:guide.clientId,status:"unreviewed",memo:""};
  }
  function guideSummary(answers){
    var source=answers&&typeof answers==="object"?answers:{};
    return [
      ["goal","최우선 마케팅 목표"],
      ["priorityMenu","우선 홍보 메뉴"],
      ["desiredCustomers","유치하고 싶은 고객"],
      ["strengths","매장 핵심 강점"],
      ["story","꼭 알리고 싶은 이야기"]
    ].map(function(field){
      return {label:field[1],value:String(source[field[0]]==null?"":source[field[0]]).trim()};
    }).filter(function(item){return item.value!=="";});
  }
  function guideFollowUps(answers){
    var source=answers&&typeof answers==="object"?answers:{};
    var fields=[
      ["concern","현재 매장의 가장 큰 고민"],
      ["goal","최우선 마케팅 목표"],
      ["priorityMenu","우선 홍보 메뉴"],
      ["currentCustomers","현재 주요 고객"],
      ["desiredCustomers","유치하고 싶은 고객"],
      ["strengths","매장 핵심 강점"],
      ["story","꼭 알리고 싶은 이야기"],
      ["contentTone","원하는 콘텐츠 분위기"],
      ["avoidExpressions","피하고 싶은 표현"],
      ["approverName","검수 및 승인 담당자 이름"],
      ["approverContact","검수 및 승인 담당자 연락 수단"],
      ["operatingNotes","운영 시 주의사항"]
    ];
    var result=[];
    fields.forEach(function(field){
      if(Object.prototype.hasOwnProperty.call(source,field[0]) && !String(source[field[0]]==null?"":source[field[0]]).trim()) result.push(field[1]);
    });
    if(Object.prototype.hasOwnProperty.call(source,"materialStatus")){
      var materialStatus=String(source.materialStatus==null?"":source.materialStatus).trim();
      if(!materialStatus) result.push("보유 사진·영상 자료 상태");
      else if(materialStatus==="별도 전달 예정") result.push("자료 별도 전달 확인");
    }
    return result;
  }
  function guideStatus(guide){
    if(guide&&guide.submittedAt!==null&&guide.submittedAt!==undefined) return "submitted";
    if(guide&&Number(guide.updatedAt)>Number(guide.createdAt)) return "draft";
    return "not_started";
  }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  function toNum(v){ if(v==null) return NaN; return parseFloat(String(v).replace(/,/g,"").trim()); }
  function fmtDate(ts){ if(!ts) return ""; var d=new Date(ts); return d.getFullYear()+"."+String(d.getMonth()+1).padStart(2,"0")+"."+String(d.getDate()).padStart(2,"0"); }
  function parseIsoDateParts(value){
    var match=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(value||""));
    if(!match) return null;
    var y=Number(match[1]), m=Number(match[2]), d=Number(match[3]);
    var date=new Date(Date.UTC(y,m-1,d));
    if(date.getUTCFullYear()!==y || date.getUTCMonth()!==m-1 || date.getUTCDate()!==d) return null;
    return { y:y, m:m, d:d, date:date };
  }
  function isMondayDate(value){
    var parts=parseIsoDateParts(value);
    return !!parts && parts.date.getUTCDay()===1;
  }
  function isoFromUtcDate(date){
    return date.getUTCFullYear()+"-"+String(date.getUTCMonth()+1).padStart(2,"0")+"-"+String(date.getUTCDate()).padStart(2,"0");
  }
  function nextMondayAfter(value){
    var parts=parseIsoDateParts(value);
    var base=parts ? parts.date : new Date();
    var date=new Date(Date.UTC(base.getUTCFullYear(),base.getUTCMonth(),base.getUTCDate()));
    date.setUTCDate(date.getUTCDate()+1);
    while(date.getUTCDay()!==1) date.setUTCDate(date.getUTCDate()+1);
    return isoFromUtcDate(date);
  }
  function validateClientStartDate(client){
    if(client && client.contractType==="new" && !isMondayDate(client.startDate)){
      return "?좉퇋 怨꾩빟 ?쒖옉?쇱? ?붿슂?쇰쭔 ?좏깮?????덉뒿?덈떎.";
    }
    return "";
  }
  function contractEndDate(client){
    if(!client || !client.startDate) return "";
    var months=Number(client.contractMonths||1);
    if(!Number.isFinite(months) || months<1) months=1;
    var parts=parseIsoDateParts(client.startDate);
    if(!parts) return "";
    var date=new Date(Date.UTC(parts.y,parts.m-1+months,1));
    var daysInTargetMonth=new Date(Date.UTC(date.getUTCFullYear(),date.getUTCMonth()+1,0)).getUTCDate();
    date.setUTCDate(Math.min(parts.d,daysInTargetMonth));
    date.setUTCDate(date.getUTCDate()-1);
    return isoFromUtcDate(date);
  }
  function checklistTasksFromSet(set){
    var items=set&&Array.isArray(set.items)?set.items:[];
    return items.map(function(item){
      return {
        id:uid("task"),
        text:String(item.text||""),
        done:false,
        day:item.day ? Number(item.day) : undefined,
        week:item.week ? String(item.week) : ""
      };
    }).filter(function(task){ return task.text.trim(); });
  }
  function buildRenewalClient(client,startDate,checklistSet){
    var savedCount=Number(client&&client.renewalCount);
    var currentCount=client&&client.contractType==="renewal"&&Number.isInteger(savedCount)&&savedCount>0 ? savedCount : 0;
    var archived=(client.previousCycles||[]).slice();
    archived.push({
      cycleNumber:currentCount+1,
      contractType:client.contractType||"new",
      startDate:client.startDate||"",
      contractMonths:client.contractMonths||"",
      excludeWeekends:client.excludeWeekends===true,
      checklist:JSON.parse(JSON.stringify(client.checklist||[])),
      progress:JSON.parse(JSON.stringify(client.progress||{})),
      archivedAt:Date.now()
    });
    var next=Object.assign({},client);
    next.contractType="renewal";
    next.renewalCount=currentCount+1;
    next.startDate=startDate;
    next.previousCycles=archived;
    next.checklist=checklistSet ? checklistTasksFromSet(checklistSet) : [];
    if(checklistSet) next.excludeWeekends=checklistSet.excludeWeekends!==false;
    next.progress={};
    next.updatedAt=Date.now();
    return next;
  }
  function monthKey(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
  function monthLabel(key){ var p=key.split("-"); return p[0]+"년 "+parseInt(p[1],10)+"월"; }
  function weeksInMonth(key){
    var p=key.split("-"), y=+p[0], m=+p[1];
    var days=new Date(y,m,0).getDate();
    return Math.ceil(days/7);
  }
  function currentWeekOf(key){
    var now=new Date();
    if(monthKey(now)!==key) return 0;
    return Math.ceil(now.getDate()/7);
  }
  function calendarDateOrdinal(dateKey){
    var parts=/^(\d{4})-(\d{2})-(\d{2})$/.exec(dateKey||"");
    if(!parts) return null;
    var year=+parts[1], month=+parts[2]-1, day=+parts[3];
    var ordinal=Date.UTC(year,month,day), date=new Date(ordinal);
    if(date.getUTCFullYear()!==year || date.getUTCMonth()!==month || date.getUTCDate()!==day) return null;
    return ordinal;
  }
  function calendarDayOrdinal(startDate,dateKey){
    var start=calendarDateOrdinal(startDate), date=calendarDateOrdinal(dateKey);
    if(start===null || date===null) return null;
    return Math.floor((date-start)/86400000)+1;
  }
  function isWeekendDate(dateKey){
    var date=calendarDateOrdinal(dateKey);
    if(date===null) return false;
    var day=new Date(date).getUTCDay();
    return day===0 || day===6;
  }
  function workdayOrdinal(startDate,dateKey){
    var start=calendarDateOrdinal(startDate), date=calendarDateOrdinal(dateKey);
    if(start===null || date===null || date<start || isWeekendDate(dateKey)) return null;
    var count=0;
    for(var current=start; current<=date; current+=86400000){
      var day=new Date(current).getUTCDay();
      if(day!==0 && day!==6) count++;
    }
    return count;
  }
  function cycleDayOrdinal(clientOrStart,dateKey){
    if(clientOrStart && typeof clientOrStart==="object"){
      return clientOrStart.excludeWeekends===true
        ? workdayOrdinal(clientOrStart.startDate,dateKey)
        : calendarDayOrdinal(clientOrStart.startDate,dateKey);
    }
    return calendarDayOrdinal(clientOrStart,dateKey);
  }
  function thirtyDayProgress(startDate, now){
    if(calendarDateOrdinal(startDate)===null) return { state:"missing", elapsed:0, week:0, percent:0, remaining:30 };
    var today=new Date(now||new Date());
    if(isNaN(today.getTime())) return { state:"missing", elapsed:0, week:0, percent:0, remaining:30 };
    var todayKey=today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0")+"-"+String(today.getDate()).padStart(2,"0");
    var raw=calendarDayOrdinal(startDate,todayKey);
    if(raw<1) return { state:"upcoming", elapsed:0, week:0, percent:0, remaining:30 };
    var elapsed=Math.min(raw,30);
    return {
      state:raw>=30?"complete":"active",
      elapsed:elapsed,
      week:Math.ceil(elapsed/7),
      percent:Math.round(elapsed/30*100),
      remaining:30-elapsed
    };
  }
  function checklistPeriod(clientOrStart, dateKey){
    var day=cycleDayOrdinal(clientOrStart,dateKey);
    if(day===null) return null;
    if(clientOrStart && typeof clientOrStart==="object" && clientOrStart.excludeWeekends===true){
      if(day<1 || day>22) return null;
      return day>20 ? "closing" : String(Math.ceil(day/5));
    }
    if(day<1 || day>30) return null;
    return day>28 ? "closing" : String(Math.ceil(day/7));
  }
  function cycleLength(client){
    return client&&client.excludeWeekends===true ? 22 : 30;
  }
  function cycleContainsDate(client,dateKey){
    var start=calendarDateOrdinal(client&&client.startDate), date=calendarDateOrdinal(dateKey);
    if(start===null || date===null || date<start) return false;
    if(client.excludeWeekends!==true) return date<=start+(29*86400000);
    var workdays=0;
    for(var current=start;workdays<22;current+=86400000){
      var day=new Date(current).getUTCDay();
      if(day!==0 && day!==6) workdays++;
      if(workdays===22) return date<=current;
    }
    return false;
  }
  function clientPreviousCycleContainsDate(client,dateKey){
    var cycles=client&&Array.isArray(client.previousCycles)?client.previousCycles:[];
    return cycles.some(function(cycle){
      return cycleContainsDate(cycle,dateKey);
    });
  }
  function calendarDateState(client,dateKey){
    var period=checklistPeriod(client,dateKey);
    var isWeekend=client&&client.excludeWeekends===true&&isWeekendDate(dateKey);
    var isEndedCycle=clientPreviousCycleContainsDate(client,dateKey);
    var isOutsideCycle=false;
    return { period:period, isWeekend:isWeekend, isOutsideCycle:isOutsideCycle, isEndedCycle:isEndedCycle };
  }
  function dailyPeriod(day){
    var value=Number(day);
    if(!isFinite(value) || Math.floor(value)!==value || value<1 || value>30) return null;
    return value>28 ? "closing" : String(Math.ceil(value/7));
  }
  function checklistSetPeriodDays(period,excludeWeekends){
    if(excludeWeekends!==false){
      if(period==="closing") return [21,22];
      var week=Number(period);
      if(!week || week<1 || week>4) return [];
      var first=(week-1)*5+1;
      return [first,first+1,first+2,first+3,first+4];
    }
    if(period==="closing") return [29,30];
    var legacyWeek=Number(period);
    if(!legacyWeek || legacyWeek<1 || legacyWeek>4) return [];
    var legacyFirst=(legacyWeek-1)*7+1;
    return [legacyFirst,legacyFirst+1,legacyFirst+2,legacyFirst+3,legacyFirst+4,legacyFirst+5,legacyFirst+6];
  }
  function moveChecklistSetTask(items,index,direction){
    if(!Array.isArray(items) || !items[index] || !dailyPeriod(items[index].day) || (direction!==-1 && direction!==1)) return false;

  function parseRevenueWon(raw){
    var text=String(raw==null?"":raw).replace(/[\s,]/g,"");

    var value=Number(text);

  function revenueForReport(report){

  function reportMonthKey(period){

    if(!parts) return null;
    var month=Number(parts[2]);

  function revenueSummary(reports,clientId,month){
    var weeklyByPeriod=[null,null,null,null,null], weeklyUpdatedAt=[-Infinity,-Infinity,-Infinity,-Infinity,-Infinity];
    var monthlyOverride=null, previousMonth=null, overrideUpdatedAt=-Infinity, previousUpdatedAt=-Infinity;
    (reports||[]).forEach(function(report){
      if(!report || report.clientId!==clientId || reportMonthKey(report.period)!==month) return;
      var revenue=revenueForReport(report), updatedAt=Number(report.updatedAt)||0;
      if(report.type==="weekly"){
        var weekMatch=/([1-5])\s*\uC8FC\uCC28/.exec(String(report.period||""));
        var weekly=parseRevenueWon(revenue.weekly);
        if(!weekMatch || weekly===null) return;
        var weekIndex=Number(weekMatch[1])-1;
        if(updatedAt>=weeklyUpdatedAt[weekIndex]){
          weeklyByPeriod[weekIndex]=weekly;
          weeklyUpdatedAt[weekIndex]=updatedAt;
        }
        return;
      }
      if(report.type!=="monthly") return;
      var override=parseRevenueWon(revenue.monthlyOverride);
      if(override!==null && updatedAt>=overrideUpdatedAt){
        monthlyOverride=override;
        overrideUpdatedAt=updatedAt;
      }
      var previous=parseRevenueWon(revenue.previousMonth);
      if(previous!==null && updatedAt>=previousUpdatedAt){
      previousMonth=previous;
      previousUpdatedAt=updatedAt;
      }
    });
    var finishingWeeks=[weeklyByPeriod[3],weeklyByPeriod[4]].filter(function(value){ return value!==null; });
    var weeklyByWeek=[weeklyByPeriod[0],weeklyByPeriod[1],weeklyByPeriod[2],
      finishingWeeks.length ? finishingWeeks.reduce(function(total,value){ return total+value; },0) : null];
    var enteredWeeks=weeklyByWeek.filter(function(value){ return value!==null; });
    var weeklyTotal=enteredWeeks.length ? enteredWeeks.reduce(function(total,value){ return total+value; },0) : null;
    var displayTotal=monthlyOverride!==null ? monthlyOverride : weeklyTotal;
    return {
      weeklyByWeek:weeklyByWeek,
      weeklyTotal:weeklyTotal,
      monthlyOverride:monthlyOverride,
      previousMonth:previousMonth,
      displayTotal:displayTotal,
      hasRevenue:enteredWeeks.length>0 || monthlyOverride!==null || previousMonth!==null
    };
  }
  function revenueAxis(maxWon){

    return { max:max, step:step, labels:[0,step,step*2,max] };
  }
  function formatRevenueWon(value){

    if(amount===0) return "0\uC6D0";

    return amount.toLocaleString("ko-KR")+"\uC6D0";
  }
  function revenueAxisLabel(value){

  function revenueTrendPanel(clientId,reports,month){

    var scaleValues=values.slice();
    if(!scaleValues.length && summary.displayTotal!==null) scaleValues.push(summary.displayTotal);
    if(!scaleValues.length && summary.previousMonth!==null) scaleValues.push(summary.previousMonth);
    var maxValue=scaleValues.length ? Math.max.apply(Math,scaleValues) : 0;
    var axis=revenueAxis(maxValue), currentWeek=currentWeekOf(month), currentChartWeek=Math.min(currentWeek,4);
    var axisHtml=axis.labels.slice().reverse().map(function(value){
      return '<span>'+revenueAxisLabel(value)+'</span>';
    }).join("");
    var described=[];
    var bars=summary.weeklyByWeek.map(function(value,index){
      var entered=value!==null, height=entered&&axis.max ? Math.max(2,value/axis.max*100) : 0;
      if(entered) described.push((index+1)+"\uC8FC\uCC28 "+formatRevenueWon(value));

        '<div class="revenue-bar-stack '+(entered?"entered":"empty")+'" style="height:'+height.toFixed(2)+'%">'+
          (entered?'<span class="revenue-bar-value">'+formatRevenueWon(value)+'</span>':"")+
          '<div class="revenue-bar '+(entered?(currentChartWeek===index+1?"current":"entered"):"empty")+'"></div></div>'+
        '<span class="revenue-bar-week">'+(index+1)+'\uC8FC</span></div>';
    }).join("");
    var eligible=(reports||[]).filter(function(report){
      return report && report.id && report.clientId===clientId && reportMonthKey(report.period)===month;
    }).sort(function(a,b){
      var aCurrent=a.type==="weekly" && new RegExp(""+currentWeek+"\\s*\\uC8FC\\uCC28").test(String(a.period||""));
      var bCurrent=b.type==="weekly" && new RegExp(""+currentWeek+"\\s*\\uC8FC\\uCC28").test(String(b.period||""));
      if(aCurrent!==bCurrent) return aCurrent?-1:1;
      var aHasRevenue=revenueSummary([a],clientId,month).hasRevenue;
      var bHasRevenue=revenueSummary([b],clientId,month).hasRevenue;
      if(aHasRevenue!==bHasRevenue) return aHasRevenue?-1:1;
      return (Number(b.updatedAt)||0)-(Number(a.updatedAt)||0);
    });
    var target=eligible[0];
    var action=target&&target.id ? '<button class="btn btn-plain btn-sm" data-edit-revenue="'+esc(target.id)+'">\uB9E4\uCD9C \uC785\uB825/\uC218\uC815</button>' : "";
    var totalLabel=summary.displayTotal!==null ? '\uC774\uBC88 \uB2EC <strong>'+formatRevenueWon(summary.displayTotal)+'</strong>' : '\uC9C0\uB09C\uB2EC <strong>'+formatRevenueWon(summary.previousMonth)+'</strong>';
    var aria=month+' \uC8FC\uCC28\uBCC4 \uB9E4\uCD9C \uB9C9\uB300 \uADF8\uB798\uD504. '+(described.length?described.join(", "):"\uC785\uB825\uB41C \uC8FC\uAC04 \uB9E4\uCD9C \uC5C6\uC74C");
    return '<section class="revenue-trend-panel">'+
      '<div class="revenue-trend-head"><div><h4 class="revenue-trend-title">\uC8FC\uCC28\uBCC4 \uB9E4\uCD9C \uD750\uB984</h4><div class="revenue-trend-total">'+totalLabel+'</div></div>'+action+'</div>'+
      '<div class="revenue-chart" role="img" aria-label="'+esc(aria)+'"><div class="revenue-y-axis">'+axisHtml+'</div><div class="revenue-bars">'+bars+'</div></div></section>';
  }
  function reportRevenueSection(rep,reports){
    if(!rep) return "";
    var revenue=revenueForReport(rep);

  async function savePublicGuide(guide, submitted){
    var answers=JSON.parse(JSON.stringify(guide&&guide.answers&&typeof guide.answers==="object"?guide.answers:{}));
    var write=publicGuideSaveChain.catch(function(){ return false; }).then(async function(){
      try{
        var result=await mutatePublicGuide(guide.id,answers,submitted);
        if(!result) return false;
        guide.updatedAt=result.updatedAt;
        guide.submittedAt=result.submittedAt;
        if(typeof result.serviceContext==="string") guide.serviceContext=result.serviceContext;
        try{ sessionStorage.setItem("guide-draft:"+guide.id,JSON.stringify(guide)); }catch(e){}
        return true;
      }catch(e){
        return false;
      }
    });
    publicGuideSaveChain=write;
    return write;
  }
  function renderGuideComplete(guide){
    var answers=guide&&guide.answers&&typeof guide.answers==="object"?guide.answers:{};
    var summary=guideSummary(answers);

    var summaryHtml=summary.length?'<div class="guide-complete-summary">'+summary.map(function(item){
      return '<div><strong>'+esc(item.label)+'</strong>'+esc(item.value)+'</div>';
    }).join("")+'</div>':"";
    var followUpNote=followUps.length?'<p class="guide-complete-note">비워 둔 질문 '+followUps.length+'개는 필요할 때 같은 링크에서 보완할 수 있어요.</p>':"";
    return '<main class="public-guide fade-in"><div class="public-guide-brand" style="padding-top:8px;"><span class="brand-mark"></span>함께 만드는 매장 안내</div>'+
      '<section class="guide-complete"><div class="guide-complete-icon">✓</div><h1>답변을 전달했어요</h1>'+
      '<p class="guide-complete-copy">소중한 내용을 바탕으로 매장을 더 잘 알릴 방법을 준비할게요. 이 같은 링크로 언제든 돌아와 답변을 수정할 수 있습니다.</p>'+
      summaryHtml+followUpNote+'<button type="button" class="btn btn-ghost btn-block" id="guide-edit-answers">답변 수정하기</button></section></main>';

    var status=document.getElementById("guide-save-status");
    var retry=document.getElementById("guide-retry-save");
    if(!status||!retry) return;

  function syncPublicGuideSection(){
    var names=["매장과 목표","고객과 메시지","운영과 확인"];
    app.querySelectorAll("[data-guide-section]").forEach(function(section){
      section.hidden=Number(section.getAttribute("data-guide-section"))!==publicGuideSection;
    });
    var title=document.getElementById("guide-progress-title");

    var fill=document.getElementById("guide-progress-fill");
    if(title) title.textContent=names[publicGuideSection];

  function queuePublicGuideSave(guide){
    clearTimeout(publicGuideSaveTimer);
    if(publicGuideSubmitting){ publicGuideSavePending=true; return; }
    var revision=++publicGuideRevision;
    setGuideSaveStatus("saving","저장 대기 중…",null);
    publicGuideSaveTimer=setTimeout(function(){ persistPublicGuideDraft(guide,revision); },500);
  }
  async function persistPublicGuideDraft(guide,revision){
    clearTimeout(publicGuideSaveTimer);
    if(publicGuideSubmitting){ publicGuideSavePending=true; return false; }
    var saveRevision=revision||++publicGuideRevision;
    setGuideSaveStatus("saving","저장 중…",null);
    var saved=await savePublicGuide(guide,false);
    if(saveRevision!==publicGuideRevision) return saved;
    if(saved){
      setGuideSaveStatus("saved","저장되었습니다",null);
    }else{
      setGuideSaveStatus("failed","저장에 실패했습니다",function(){ persistPublicGuideDraft(guide,++publicGuideRevision); });
    }
    return saved;
  }
  async function submitPublicGuide(guide){
    if(publicGuideSubmitting) return;
    clearTimeout(publicGuideSaveTimer);
    ++publicGuideRevision;
    publicGuideSubmitting=true;
    publicGuideSavePending=false;
    var submit=document.getElementById("guide-submit");
    if(submit){ submit.disabled=true; submit.textContent="제출 중…"; }
    app.querySelectorAll("[data-guide-field],#guide-prev,#guide-next").forEach(function(control){ control.disabled=true; });
    setGuideSaveStatus("saving","제출 내용을 저장 중…",null);
    var saved=await savePublicGuide(guide,true);
    while(saved&&publicGuideSavePending){
      publicGuideSavePending=false;
      saved=await savePublicGuide(guide,false);
    }
    publicGuideSubmitting=false;
    if(!saved){
      if(submit){ submit.disabled=false; submit.textContent="제출하기"; }
      app.querySelectorAll("[data-guide-field],#guide-prev,#guide-next").forEach(function(control){ control.disabled=false; });
      setGuideSaveStatus("failed","저장에 실패했습니다",function(){ submitPublicGuide(guide); });
      return;
    }
    app.innerHTML=renderGuideComplete(guide);
    var edit=document.getElementById("guide-edit-answers");
    if(edit) edit.addEventListener("click",function(){ mountPublicGuide(guide); });
  }
  function bindPublicGuide(guide){
    app.querySelectorAll("[data-guide-field]").forEach(function(field){
      field.addEventListener("input",function(){
        if(field.type==="radio"&&!field.checked) return;
        guide.answers[field.getAttribute("data-guide-field")]=field.value;
        queuePublicGuideSave(guide);
      });
    });
    var previous=document.getElementById("guide-prev");
    var next=document.getElementById("guide-next");
    if(previous) previous.addEventListener("click",function(){
      persistPublicGuideDraft(guide,++publicGuideRevision);
      publicGuideSection=Math.max(0,publicGuideSection-1); syncPublicGuideSection();
    });
    if(next) next.addEventListener("click",function(){
      persistPublicGuideDraft(guide,++publicGuideRevision);
      publicGuideSection=Math.min(2,publicGuideSection+1); syncPublicGuideSection();
    });
    var form=document.getElementById("public-guide-form");
    if(form) form.addEventListener("submit",function(event){ event.preventDefault(); submitPublicGuide(guide); });
    syncPublicGuideSection();
  }
  function mountPublicGuide(guide){
    clearTimeout(publicGuideSaveTimer);
    publicGuideSection=0;
    app.innerHTML=renderPublicGuide(guide);
    bindPublicGuide(guide);
  }

  async function loadPublicGuidePage(publicGuideId){
    if(!/^guide_[A-Za-z0-9_-]{24,}$/.test(publicGuideId||"")){
      app.innerHTML=renderPublicGuideUnavailable("missing");
      return "missing";
    }
    app.innerHTML='<div style="padding:60px;text-align:center;color:#8B95A1;">안내문을 불러오는 중…</div>';
    var result;
    try{ result=(typeof storageBackend!=="undefined"&&storageBackend.getPublicGuide) ? {status:"found",value:await storageBackend.getPublicGuide(publicGuideId)} : await readS("guide:"+publicGuideId); }
    catch(e){ result={status:e&&e.code==="not_found"?"missing":"error",error:e}; }
    var guide=result.status==="found"?result.value:null;
    if(result.status!=="found"||!guide||typeof guide!=="object"||guide.id!==publicGuideId||!guide.answers||typeof guide.answers!=="object"){
      if(result.status==="error"){
        try{
          var cached=JSON.parse(sessionStorage.getItem("guide-draft:"+publicGuideId)||"null");
          if(cached&&cached.id===publicGuideId&&cached.answers&&typeof cached.answers==="object"){
            mountPublicGuide(cached);
            setGuideSaveStatus("failed","연결이 복구되면 서버에 동기화됩니다",function(){ loadPublicGuidePage(publicGuideId); });
            return "ready";
          }
        }catch(e){}
      }
      var stateName=result.status==="missing"?"missing":"error";
      app.innerHTML=renderPublicGuideUnavailable(stateName);
      if(stateName==="error"){
        var retry=document.getElementById("btn-retry-public-guide");
        if(retry) retry.onclick=function(){ loadPublicGuidePage(publicGuideId); };
      }
      return stateName;
    }
    if(guideStatus(guide)==="submitted"){
      app.innerHTML=renderGuideComplete(guide);
      var editPublicGuide=document.getElementById("guide-edit-answers");
      if(editPublicGuide) editPublicGuide.addEventListener("click",function(){ mountPublicGuide(guide); });
    }else{
      mountPublicGuide(guide);
    }
    return "ready";
  }

    app.innerHTML =

          '<button class="btn btn-primary btn-block" id="btn-login">들어가기</button>'+
        '</div>'+
      '</div>';

    var pw = document.getElementById("login-pw");
    pw.focus();
    pw.addEventListener("keydown", function(e){ if (e.key === "Enter") doLogin(); });
    document.getElementById("btn-login").addEventListener("click", doLogin);

    async function doLogin(){
      var btn = document.getElementById("btn-login");
      var errBox = document.getElementById("login-error");
      var val = pw.value;
      if (!val) { showToast("비밀번호를 입력하십시오"); return; }
      btn.disabled = true; btn.textContent = "확인 중…";
      errBox.style.display = "none";
      try {
        var res = await fetch("/api/auth", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: val })
        });
        var data = await res.json().catch(function(){ return {}; });
        if (!res.ok) {
          errBox.textContent = data.error || "비밀번호가 올바르지 않습니다";
          errBox.style.display = "block";
          btn.disabled = false; btn.textContent = "들어가기";
          return;
        }
        if (!data.redisConfigured) {
          errBox.textContent = "Redis가 연결되지 않았습니다. Vercel에서 Upstash Redis를 연결해 주세요.";
          errBox.style.display = "block";
          btn.disabled = false; btn.textContent = "들어가기";
          return;
        }
        authToken = data.token;
        try { localStorage.setItem(AUTH_KEY, authToken); } catch(e) {}
        await loadWorkspace();
      } catch(e) {
        errBox.textContent = "접속에 실패했습니다. 잠시 후 다시 시도해 주세요.";
        errBox.style.display = "block";
        btn.disabled = false; btn.textContent = "들어가기";
      }
    }
  }

  function contractEndKey(cl){
    if(!cl.startDate) return null;
    var d=new Date(cl.startDate);
    if(isNaN(d.getTime())) return null;
    var months=parseInt(cl.contractMonths,10); if(isNaN(months)||months<=0) months=3;
    d.setMonth(d.getMonth()+months);
    return d;
  }
  function isNewIn(cl, mk){
    if(!cl.startDate) return false;
    var d=new Date(cl.startDate);
    if(isNaN(d.getTime())) return false;
    return monthKey(d)===mk;
  }
  function renewalsIn(cl, mk){
    return (cl.renewals||[]).filter(function(r){ return r===mk; }).length;
  }
  function progressOf(cl, mk){
    var wk=weeksInMonth(mk), pm=(cl.progress||{})[mk]||{};
    var done=0;
    for(var i=1;i<=wk;i++){ if(pm[i]==="done") done++; }
    return { done:done, total:wk };
  }

    var totalCells=0, doneCells=0;
    active.forEach(function(c){ var p=progressOf(c,mk); totalCells+=p.total; doneCells+=p.done; });

        '<div class="stat-card accent"><div class="stat-label">이번 달 진행률</div><div class="stat-value">'+pct+'<span class="stat-unit">%</span></div>'+

  async function cycleWeek(clientId, week){
    var cl=await getS("client:"+clientId);
    if(!cl){ showToast("업체 정보를 불러오지 못했습니다"); return; }
    cl.progress=cl.progress||{};
    cl.progress[state.month]=cl.progress[state.month]||{};
    var cur=cl.progress[state.month][week]||"none";
    var nextSt= cur==="none"?"doing": cur==="doing"?"done":"none";
    if(nextSt==="none") delete cl.progress[state.month][week];
    else cl.progress[state.month][week]=nextSt;
    await setS("client:"+clientId, cl);
    if(state.view==="dashboard") fillDashboard();
    else if(state.view==="clientDetail"){ state.currentClient=cl; render(); }
  }

  function blankContract(){
    return { id:"", clientId:"", clientName:"", contractType:"new", renewalCount:1, productType:"regular", productName:"", supplyPrice:"", paymentMethod:"card", businessNumber:"", contact:"", email:"", startDate:"", contractMonths:"3", fee:"", terms:"", baseTerms:"", internalMemo:"", owner:"", signerName:"", signatureDataUrl:"", createdAt:null, updatedAt:null };
  }
  function newContractDraft(){
    var bytes=new Uint8Array(24);
    if(typeof crypto!=="undefined"&&crypto.getRandomValues) crypto.getRandomValues(bytes);
    else for(var i=0;i<bytes.length;i++) bytes[i]=Math.floor(Math.random()*256);
    var token=Array.prototype.map.call(bytes,function(byte){return byte.toString(16).padStart(2,"0");}).join("");
    var contract=blankContract();
    contract.id="contract_"+token;
    contract.clientId=uid("cl");
    contract.createdAt=Date.now();
    contract.updatedAt=contract.createdAt;
    return contract;
  }
  function publicContractPayload(contract){
    var source=Object.assign(blankContract(),contract||{});
    var allowed=["id","clientId","clientName","contractType","renewalCount","productType","productName","supplyPrice","paymentMethod","businessNumber","contact","email","startDate","contractMonths","fee","terms","specialTerms","baseTerms","signerName","signatureDataUrl","createdAt","updatedAt","submittedAt"];
    var out={};
    allowed.forEach(function(key){ if(source[key]!==undefined) out[key]=source[key]; });
    return out;
  }

  function bindSignaturePad(canvas){
    if(!canvas || !canvas.getContext) return;
    var ctx=canvas.getContext("2d"), drawing=false, last=null;
    canvas.dataset.signatureDirty=canvas.dataset.signatureDirty||"0";
    canvas.dataset.signatureCleared=canvas.dataset.signatureCleared||"0";
    ctx.lineWidth=3; ctx.lineCap="round"; ctx.strokeStyle="#191F28";
    function point(e){ var r=canvas.getBoundingClientRect(), t=e.touches&&e.touches[0]||e; return { x:(t.clientX-r.left)*(canvas.width/r.width), y:(t.clientY-r.top)*(canvas.height/r.height) }; }
    function start(e){ drawing=true; last=point(e); canvas.dataset.signatureDirty="1"; canvas.dataset.signatureCleared="0"; e.preventDefault&&e.preventDefault(); }
    function move(e){ if(!drawing) return; var p=point(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; e.preventDefault&&e.preventDefault(); }
    function end(){ drawing=false; last=null; }
    canvas.addEventListener("mousedown",start); canvas.addEventListener("mousemove",move); window.addEventListener("mouseup",end);
    canvas.addEventListener("touchstart",start,{passive:false}); canvas.addEventListener("touchmove",move,{passive:false}); canvas.addEventListener("touchend",end);
  }
  function restoreSignatureToCanvas(canvas,dataUrl){

      canvas.dataset.signatureCleared="0";
    };
    img.src=dataUrl;
  }
  function signatureValueFromCanvas(canvas,currentValue){

  }

  async function issueGuideForClient(client){
    if(!client || !client.id) return null;
    var storedClient=await getS("client:"+client.id);
    if(!storedClient){
      storedClient=Object.assign({},client);
      var recovered=await setS("client:"+client.id,storedClient);
      if(!recovered) return null;
    }
    if(storedClient.guideId){
      client.guideId=storedClient.guideId;
      return await getS("guide:"+storedClient.guideId);
    }
    var reservation=await reserveGuideIssue(client.id);
    var guide=reservation&&reservation.guide&&reservation.guide.clientId===client.id?reservation.guide:null;
    if(!guide) return null;
    var reviewKey="guide-review:"+guide.id;
    var storedReview=await readS(reviewKey);
    if(storedReview.status==="error") return null;
    if(storedReview.status==="found"&&(
      !storedReview.value||typeof storedReview.value!=="object"||
      storedReview.value.guideId!==guide.id||storedReview.value.clientId!==guide.clientId||
      ["unreviewed","reviewing","reviewed"].indexOf(storedReview.value.status)<0||
      typeof storedReview.value.memo!=="string"
    )) return null;
    if(storedReview.status==="missing"){
      var reviewSaved=await setS(reviewKey,newGuideReview(guide));
      if(!reviewSaved) return null;
    }
    var linkedClient=Object.assign({},storedClient,{guideId:guide.id});
    var clientSaved=await setS("client:"+client.id,linkedClient);
    if(!clientSaved) return null;
    client.guideId=guide.id;
    return guide;
  }

  function checklistTaskPeriod(client,task){
    if(!task) return "";
    if(task.day){
      var value=Number(task.day);
      if(!isFinite(value) || Math.floor(value)!==value || value<1) return "";
      if(client&&client.startDate){
        var startOrdinal=calendarDateOrdinal(client.startDate);
        if(startOrdinal!==null){
          var dateKey;
          if(client.excludeWeekends===true){
            var cursor=new Date(client.startDate+"T12:00:00"), seen=0, guard=0;
            while(guard<80){
              var key=isoDate(cursor);
              if(!isWeekendDate(key)){ seen++; if(seen===value){ dateKey=key; break; } }
              cursor.setDate(cursor.getDate()+1); guard++;
            }
          } else {
            var date=new Date((startOrdinal+value-1)*86400000);
            dateKey=isoFromUtcDate(date);
          }
          var period=dateKey ? checklistPeriod(client,dateKey) : null;
          return period||dailyPeriod(value)||"";
        }
      }
      return dailyPeriod(value)||"";
    }
    return task.week||"";
  }

  async function saveClientAndRefresh(cl){

    state.clients=idx;
    await setP("clients-index", idx);
    state.currentClient=cl;
    if(state.view==="clientDetail") render();
  }

  function renewalDialog(client){
    var modal=document.getElementById("renewal-modal");
    var defaultDate=nextMondayAfter(contractEndDate(client)||isoDate(new Date()));
    var dateStep=document.getElementById("renewal-date-step");
    var setStep=document.getElementById("renewal-set-step");
    var setOptions=document.getElementById("renewal-set-options");
    state.renewalSelectedSetId="";
    document.getElementById("renewal-start-date").value=defaultDate;
    dateStep.hidden=false;
    setStep.hidden=true;
    setOptions.innerHTML='<button type="button" data-renewal-set="" class="active">세트 없이 시작</button>'+(state.checklistSets||[]).map(function(set){
      return '<button type="button" data-renewal-set="'+esc(set.id)+'">'+esc(set.name)+'</button>';
    }).join("");
    modal.classList.add("show");
    function close(){ modal.classList.remove("show"); }
    document.getElementById("btn-cancel-renewal").onclick=close;
    document.getElementById("btn-next-renewal").onclick=function(){ dateStep.hidden=true; setStep.hidden=false; };
    document.getElementById("btn-back-renewal").onclick=function(){ setStep.hidden=true; dateStep.hidden=false; };
    setOptions.querySelectorAll("[data-renewal-set]").forEach(function(button){
      button.onclick=function(){
        state.renewalSelectedSetId=button.getAttribute("data-renewal-set")||"";
        setOptions.querySelectorAll("[data-renewal-set]").forEach(function(option){ option.classList.toggle("active",option===button); });
      };
    });
    document.getElementById("btn-confirm-renewal").onclick=async function(){
      var startDate=document.getElementById("renewal-start-date").value;
      if(!isMondayDate(startDate)){
        showToast("재계약 시작일은 월요일만 선택할 수 있습니다.");
        return;
      }
      var selectedSetId=state.renewalSelectedSetId||"";
      var selectedSet=selectedSetId ? state.checklistSets.find(function(set){ return set.id===selectedSetId; }) : null;
      var renewed=buildRenewalClient(client,startDate,selectedSet);
      renewed.renewals=renewed.renewals||[];
      if(renewed.renewals.indexOf(state.month)===-1) renewed.renewals.push(state.month);
      renewed.status="active";
      var saved=await setS("client:"+client.id,renewed);
      if(!saved){ showToast("재계약 저장에 실패했습니다"); return; }
      var index=state.clients.filter(function(item){ return item.id!==renewed.id; });
      index.push({ id:renewed.id, name:renewed.name, contractType:renewed.contractType, renewalCount:renewed.renewalCount, startDate:renewed.startDate, status:renewed.status, updatedAt:renewed.updatedAt });
      var indexSaved=await setP("clients-index",index);
      if(!indexSaved){ showToast("\uC7AC\uACC4\uC57D \uC800\uC7A5\uC5D0 \uC2E4\uD328\uD588\uC2B5\uB2C8\uB2E4"); return; }
      state.currentClient=renewed;
      state.clients=index;
      close();
      renderClientWorkspace(renewed);
    };
  }

  async function markRenewal(id){

  function editDelegated(e){
    var typeBtn=e.target.closest(".type-toggle [data-type]");
    if(typeBtn){
      if(typeBtn.classList.contains("active")) return;
      var nt=typeBtn.getAttribute("data-type");
      var keep={ type:nt };
      var ce=document.getElementById("f-client"); if(ce) keep.client=ce.value;
      var pe=document.getElementById("f-period"); if(pe) keep.period=pe.value;
      var ge=document.getElementById("f-goal"); if(ge) keep.goal=ge.value;
      if(document.getElementById("channels-container")) keep.channels=collectChannels();
      var b=state.editingBase||{};
      keep.clientId=b.clientId; keep.id=b.id; keep.createdAt=b.createdAt;
      if(b.revenue&&typeof b.revenue==="object") keep.revenue=Object.assign({},b.revenue);
      var weeklyRevenue=document.getElementById("f-revenue-weekly");
      var previousRevenue=document.getElementById("f-revenue-previous");
      var overrideRevenue=document.getElementById("f-revenue-override");
      if(weeklyRevenue||previousRevenue||overrideRevenue){
        keep.revenue=keep.revenue||{};
        if(weeklyRevenue) keep.revenue.weekly=weeklyRevenue.value;
        if(previousRevenue) keep.revenue.previousMonth=previousRevenue.value;
        if(overrideRevenue) keep.revenue.monthlyOverride=overrideRevenue.value;
      }
      state.editingBase=keep; renderEdit(keep); return;
    }
    var qb=e.target.closest("[data-quickchannel]");
    if(qb){
      var cont=document.getElementById("channels-container");
      var nm=qb.getAttribute("data-quickchannel");
      if(nm){
        var dup=null;
        cont.querySelectorAll(".channel-name").forEach(function(i){ if(!dup&&i.value.trim()===nm) dup=i; });
        if(dup){ dup.focus(); showToast("이미 추가된 채널입니다"); return; }
      }
      cont.insertAdjacentHTML("beforeend", channelBlockTpl({name:nm}));
      var last=cont.lastElementChild.querySelector(".channel-name");
      if(!nm) last.focus(); else qb.remove();
      return;
    }
    var rc=e.target.closest('[data-action="remove-channel"]');
    if(rc){
      var c2=document.getElementById("channels-container");
      if(c2.children.length>1) rc.closest(".channel-block").remove();
      else showToast("최소 1개 채널은 유지해야 합니다");
      return;
    }
    var am=e.target.closest('[data-action="add-metric"]');
    if(am){ am.closest(".channel-block").querySelector(".channel-metrics").insertAdjacentHTML("beforeend", metricRowTpl({})); return; }
    var rr=e.target.closest('[data-action="remove-row"]');
    if(rr){
      var row=rr.closest(".row, .metric-row"), par=row.parentElement;
      if(par.children.length>1) row.remove();
      else showToast("최소 1개 항목은 유지해야 합니다");
      return;
    }
    var ab=e.target.closest("[data-add]");
    if(ab){
      var t=document.getElementById(ab.getAttribute("data-add"));
      t.insertAdjacentHTML("beforeend", rowTpl("내용을 입력하세요",""));
      return;
    }
  }

  function collectRows(id){
    var c=document.getElementById(id), out=[];
    if(!c) return out;
    c.querySelectorAll(".row-input").forEach(function(i){ var v=i.value.trim(); if(v) out.push(v); });
    return out;
  }
  function collectChannels(){
    var out=[];
    document.querySelectorAll("#channels-container .channel-block").forEach(function(b){
      var name=b.querySelector(".channel-name").value.trim(), ms=[];
      b.querySelectorAll(".metric-row").forEach(function(r){
        var label=r.querySelector(".m-label").value.trim();
        var value=r.querySelector(".m-value").value.trim();
        if(!label&&!value) return;
        ms.push({ label:label, value:value,
          unit:r.querySelector(".m-unit").value.trim(),
          compareValue:r.querySelector(".m-compare").value.trim(),
          compareLabel:r.querySelector(".m-comparelabel").value.trim() });
      });
      if(!name&&ms.length===0) return;
      out.push({ name:name||"미지정 채널", metrics:ms });
    });
    return out;
  }

  async function saveReport(){
    var ce=document.getElementById("f-client"), pe=document.getElementById("f-period");
    if(!ce||!pe){ showToast("폼을 다시 불러온 뒤 시도하십시오"); return; }
    var client=ce.value.trim(), period=pe.value.trim();
    if(!client||!period){ showToast("업체명과 기간을 입력하십시오"); return; }

    var type=document.querySelector(".form-card").getAttribute("data-report-type");
    var revenue={}, hasRevenueInputs=false, revenueFields=type==="weekly"
      ? [{ id:"f-revenue-weekly", key:"weekly" }]
      : [{ id:"f-revenue-previous", key:"previousMonth" }, { id:"f-revenue-override", key:"monthlyOverride" }];
    for(var revenueIndex=0;revenueIndex<revenueFields.length;revenueIndex++){
      var revenueField=revenueFields[revenueIndex], revenueInput=document.getElementById(revenueField.id);
      if(!revenueInput) continue;
      hasRevenueInputs=true;
      var revenueRaw=revenueInput.value, revenueValue=parseRevenueWon(revenueRaw);
      revenueInput.setCustomValidity("");
      if(revenueRaw.trim()!=="" && revenueValue===null){
        revenueInput.setCustomValidity("0 \uC774\uC0C1\uC758 \uC6D0 \uB2E8\uC704 \uC22B\uC790\uB85C \uC785\uB825\uD574 \uC8FC\uC138\uC694.");
        revenueInput.reportValidity();
        revenueInput.focus();
        return;
      }
      revenue[revenueField.key]=revenueValue;
    }

    var btn=document.getElementById("btn-save");
    btn.disabled=true; btn.textContent="저장 중…";
    try{
      var b=state.editingBase||{};
      var reportClientId=b.clientId || (state.currentClient?state.currentClient.id:null);
      if(type==="monthly"){
        var reportMonth=reportMonthKey(period);
        var weeklySnapshot=reportClientId&&reportMonth ? revenueSummary(state.reports,reportClientId,reportMonth).weeklyTotal : null;
        if(weeklySnapshot!==null) revenue.weeklyTotal=weeklySnapshot;
        else {
          var savedWeeklySnapshot=parseRevenueWon(b.revenue&&b.revenue.weeklyTotal);
          if(savedWeeklySnapshot!==null) revenue.weeklyTotal=savedWeeklySnapshot;
        }
      }
      Object.keys(revenue).forEach(function(key){ if(revenue[key]===null) delete revenue[key]; });
      var rep={ type:type, client:client, period:period,
        clientId: reportClientId,
        goal:document.getElementById("f-goal").value.trim(),
        channels:collectChannels(), updatedAt:Date.now() };
      if(Object.keys(revenue).length) rep.revenue=revenue;
      else if(!hasRevenueInputs && b.revenue && typeof b.revenue==="object") rep.revenue=Object.assign({},b.revenue);

      if(type==="weekly"){
        rep.external=document.getElementById("f-external").value.trim();
        rep.tests=collectRows("rows-tests");
        rep.results=collectRows("rows-results");
        rep.next_week=collectRows("rows-nextweek");
        rep.deliveryMemo=document.getElementById("f-delivery-memo").value.trim();
      } else {
        rep.actions_done=collectRows("rows-actions");
        rep.facts=collectRows("rows-facts");
        rep.interpretations=collectRows("rows-interps");
        rep.uncertain=document.getElementById("f-uncertain").value.trim();
        rep.next={ keep:collectRows("rows-keep"), fix:collectRows("rows-fix"),
                   stop:collectRows("rows-stop"), scale:collectRows("rows-scale") };
        rep.memo=document.getElementById("f-memo").value.trim();
      }

      var id=b.id||uid("rpt");
      rep.id=id; rep.createdAt=b.createdAt||Date.now();

      var ok=await setS("report:"+id, rep);
      if(!ok) throw new Error("save failed");

      var idx=state.reports.filter(function(r){ return r.id!==id; });
      var reportMeta={ id:id, clientId:rep.clientId, clientName:client, period:period, type:type, updatedAt:rep.updatedAt };
      if(rep.revenue) reportMeta.revenue=Object.assign({},rep.revenue);
      idx.push(reportMeta);
      state.reports=idx;
      await setP("reports-index", idx);

      state.currentReport=rep; state.summaryMode=false; state.view="report";
      showToast("리포트가 저장되었습니다"); render();
    }catch(err){
      console.error(err); showToast("저장에 실패했습니다. 다시 시도하십시오");
      btn.disabled=false; btn.textContent="리포트 저장";
    }
  }

  async function deleteReport(id){

    state.view = state.currentClient ? "clientDetail" : "dashboard";
    render();

    return '<div class="mc-delta '+d.dir+'">'+arrow+' '+Math.abs(d.pct).toFixed(1)+'% <span style="font-weight:600;opacity:.85;">'+esc(m.compareLabel||"비교")+'</span></div>';

      '<div class="report-header fade-in">'+
        '<span class="status-pill">'+pill+'</span>'+
        '<h2 class="rh-client">'+esc(rep.client||"")+'</h2>'+
        '<p class="rh-period">'+esc(rep.period||"")+'</p>'+
        (rep.goal?('<div class="rh-goal-label">'+(rep.type==="weekly"?"이번 주 목표":"이번 달 목표")+'</div><div class="rh-goal">'+esc(rep.goal)+'</div>'):"")+
      '</div>'+body;

    var backEl = document.getElementById("btn-back");
    if (backEl) backEl.addEventListener("click", function(){
      state.view = state.currentClient ? "clientDetail" : "dashboard"; render();
    });
    var editEl = document.getElementById("btn-edit-report");
    if (editEl) editEl.addEventListener("click", function(){
      state.editingBase=rep; state.view="edit"; render();
    });
    var delEl = document.getElementById("btn-del-report");
    if (delEl) delEl.addEventListener("click", function(){
      confirmDialog("리포트를 삭제할까요?", (rep.period||"")+" 리포트가 삭제됩니다. 이 작업은 되돌릴 수 없습니다.", "삭제", function(){ deleteReport(rep.id); });
    });
    app.querySelectorAll(".mode-toggle button").forEach(function(b){
      b.addEventListener("click", function(){ state.summaryMode=b.getAttribute("data-mode")==="summary"; render(); });
    });
    app.querySelectorAll("[data-copy]").forEach(function(b){
      b.addEventListener("click", function(){ copyText(b.getAttribute("data-copy")); });
    });
    animateNumbers();
  }

  function animateNumbers(){
    var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    document.querySelectorAll(".mc-value[data-count-to]").forEach(function(el){
      var target=parseFloat(el.getAttribute("data-count-to"));
      if(isNaN(target)) return;
      if(reduce){ el.textContent=target.toLocaleString("ko-KR",{maximumFractionDigits:2}); return; }
      var t0=null, dur=520;
      function step(ts){
        if(!t0) t0=ts;
        var p=Math.min(1,(ts-t0)/dur), e=1-Math.pow(1-p,3);
        el.textContent=(target*e).toLocaleString("ko-KR",{maximumFractionDigits: target%1!==0?2:0});
        if(p<1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    });
  }

  init();
})();
</script>
</body>
</html>
