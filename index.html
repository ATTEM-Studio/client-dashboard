<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>업체 관리 대시보드</title>
<style>
  :root{
    --bg-page:#F2F4F6;
    --bg-card:#FFFFFF;
    --ink-900:#191F28;
    --ink-700:#333D4B;
    --ink-600:#4E5968;
    --ink-500:#6B7684;
    --ink-400:#8B95A1;
    --ink-300:#B0B8C1;
    --line:#E5E8EB;
    --brand:#3182F6;
    --brand-light:#EBF2FE;
    --brand-dark:#1B64DA;
    --keep:#3182F6;   --keep-light:#EBF2FE;
    --fix:#F5A623;    --fix-light:#FFF6E5;
    --stop:#F04452;   --stop-light:#FEECEE;
    --danger:var(--stop);
    --scale:#00C471;  --scale-light:#E6F9F0;
    --radius-lg:20px;
    --radius-md:14px;
    --shadow-card: 0 1px 2px rgba(15,23,42,.05), 0 10px 24px -14px rgba(15,23,42,.16);
    --shadow-pop: 0 8px 28px -8px rgba(15,23,42,.22);
    --motion-press:110ms;
    --motion-short:200ms;
    --motion-spatial:460ms;
    --ease-spring:cubic-bezier(.2,.9,.25,1.12);
    --ease-out:cubic-bezier(.2,.7,.2,1);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg-page); color:var(--ink-900);
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.5;
  }
  button,input,textarea,select{ font-family:inherit; }
  button{ cursor:pointer; }
  input:focus-visible,textarea:focus-visible,button:focus-visible,select:focus-visible{ outline:2px solid var(--brand); outline-offset:2px; }
  #app{ max-width:920px; margin:0 auto; padding:24px 20px 100px; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; gap:12px; }
  .dashboard-menu{ position:relative; }
  .dashboard-menu-toggle{ display:flex; align-items:center; gap:7px; }
  .dashboard-menu-toggle .menu-chevron{ transition:transform var(--motion-short) var(--ease-out); }
  .dashboard-menu.open .menu-chevron{ transform:rotate(180deg); }
  .dashboard-menu-panel{ position:absolute; right:0; top:calc(100% + 8px); z-index:20; min-width:170px; padding:6px; border:1px solid var(--line); border-radius:14px; background:#fff; box-shadow:var(--shadow-pop); opacity:0; transform:translateY(-6px) scale(.98); transform-origin:top right; pointer-events:none; transition:opacity var(--motion-short) var(--ease-out),transform var(--motion-short) var(--ease-out); }
  .dashboard-menu.open .dashboard-menu-panel{ opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
  .dashboard-menu-item{ display:flex; width:100%; align-items:center; gap:9px; border:0; border-radius:10px; padding:11px 12px; background:transparent; color:var(--ink-700); font-size:13px; font-weight:700; text-align:left; opacity:0; transform:translateY(-4px); }
  .dashboard-menu-item:hover{ background:var(--brand-light); color:var(--brand-dark); }
  .dashboard-menu.open .dashboard-menu-item{ transition:transform var(--motion-short) var(--ease-out),opacity var(--motion-short) var(--ease-out); }
  .dashboard-menu.open .dashboard-menu-item{ opacity:1; transform:translateY(0); }
  .dashboard-menu.open .dashboard-menu-item:nth-child(1){ transition-delay:40ms; }
  .dashboard-menu.open .dashboard-menu-item:nth-child(2){ transition-delay:80ms; }
  @media(max-width:480px){ .dashboard-menu-panel{ right:-4px; min-width:180px; } }
  .brand{ display:flex; align-items:center; gap:9px; font-weight:800; font-size:17px; }
  .brand-mark{ width:24px; height:24px; border-radius:8px; background:linear-gradient(135deg,var(--brand),var(--brand-dark)); position:relative; flex:none; }
  .brand-mark::after{ content:""; position:absolute; left:6px; top:11px; width:12px; height:3px; border-radius:2px; background:#fff; box-shadow:0 -5px 0 #fff; }

  .btn{ border:none; border-radius:12px; padding:11px 16px; font-size:14px; font-weight:700; transition:transform var(--motion-press) var(--ease-out), background var(--motion-short) var(--ease-out); white-space:nowrap; }
  .btn:active{ transform:scale(.97); }
  .btn.is-pressing,.client-card.is-pressing,.detail-tab.is-pressing,.dashboard-menu-item.is-pressing{ transform:scale(.97); }
  .btn-primary{ background:var(--brand); color:#fff; box-shadow:0 6px 16px -6px rgba(49,130,246,.55); }
  .btn-primary:hover{ background:var(--brand-dark); }
  .btn-ghost{ background:var(--brand-light); color:var(--brand-dark); }
  .btn-plain{ background:#F2F4F6; color:var(--ink-700); }
  .btn-plain:hover{ background:#E9ECEF; }
  .btn-text{ background:none; color:var(--ink-600); padding:8px 6px; }
  .btn-danger{ background:var(--stop-light); color:var(--stop); }
  .btn-danger:hover{ background:#FDDDE1; }
  .btn-sm{ padding:8px 12px; font-size:13px; border-radius:10px; }
  .btn-block{ width:100%; }

  .hero{ margin-bottom:18px; }
  .eyebrow{ font-size:12.5px; font-weight:800; color:var(--brand); margin:0 0 8px; }
  .hero h1{ font-size:25px; font-weight:800; margin:0 0 8px; letter-spacing:-.02em; }
  .hero .sub{ font-size:14px; color:var(--ink-600); margin:0; max-width:580px; }

  /* month bar */
  .monthbar{ display:flex; align-items:center; gap:8px; margin-bottom:16px; }
  .monthbar .mb-label{ font-size:15px; font-weight:800; min-width:110px; text-align:center; }
  .mb-arrow{ border:none; background:var(--bg-card); box-shadow:var(--shadow-card); width:32px; height:32px; border-radius:10px; color:var(--ink-700); font-size:14px; }
  .mb-today{ margin-left:auto; }

  /* stats */
  .stats-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:22px; }
  @media(max-width:700px){ .stats-grid{ grid-template-columns:repeat(2,1fr); } }
  .stat-card{ background:var(--bg-card); border-radius:var(--radius-md); padding:15px 16px; box-shadow:var(--shadow-card); }
  .stat-label{ font-size:12px; font-weight:700; color:var(--ink-400); margin-bottom:7px; }
  .stat-value{ font-size:23px; font-weight:800; letter-spacing:-.01em; }
  .stat-unit{ font-size:13px; font-weight:600; color:var(--ink-400); margin-left:2px; }
  .stat-sub{ font-size:11.5px; color:var(--ink-400); margin-top:5px; }
  .stat-card.accent{ background:linear-gradient(150deg,#1B64DA,#3182F6); color:#fff; }
  .stat-card.accent .stat-label,.stat-card.accent .stat-sub{ color:rgba(255,255,255,.8); }
  .stat-card.accent .stat-unit{ color:rgba(255,255,255,.75); }

  .progress-track{ height:5px; border-radius:99px; background:rgba(255,255,255,.28); margin-top:9px; overflow:hidden; }
  .progress-fill{ height:100%; border-radius:99px; background:#fff; transition:width var(--motion-spatial) var(--ease-out); }

  /* section head */
  .sec-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px; }
  .sec-head h2{ font-size:16px; margin:0; }
  .sec-head .count{ font-size:13px; color:var(--ink-400); font-weight:600; }

  /* client card */
  .client-card{ background:var(--bg-card); border-radius:var(--radius-md); padding:16px 18px; box-shadow:var(--shadow-card); margin-bottom:10px; transition:box-shadow var(--motion-short) var(--ease-out), transform var(--motion-press) var(--ease-out); }
  .client-card:hover{ box-shadow:var(--shadow-pop); transform:translateY(-1px); }
  .client-card:hover.is-pressing{ transform:scale(.97); }
  .cc-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .cc-name{ font-weight:800; font-size:15.5px; display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
  .cc-meta{ font-size:12.5px; color:var(--ink-400); margin-top:4px; }
  .cc-arrow{ color:var(--ink-300); font-size:18px; flex:none; }

  .tag{ font-size:10.5px; font-weight:800; padding:2px 8px; border-radius:6px; }
  .tag-new{ background:var(--scale-light); color:#0B8F55; }
  .tag-renew{ background:var(--brand-light); color:var(--brand-dark); }
  .tag-paused{ background:#F2F4F6; color:var(--ink-500); }
  .tag-ended{ background:var(--stop-light); color:var(--stop); }
  .tag-soon{ background:var(--fix-light); color:#B6790C; }

  /* week strip */
  .week-strip{ display:flex; gap:6px; margin-top:12px; }
  .day-progress{ margin-top:14px; }
  .day-progress-copy{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:8px; }
  .day-progress-copy strong{ font-size:12.5px; color:var(--brand-dark); }
  .day-progress-copy span{ font-size:11.5px; color:var(--ink-400); white-space:nowrap; }
  .day-progress-track{ height:12px; border-radius:99px; background:#EEF1F5; overflow:hidden; }
  .day-progress-fill{ height:100%; border-radius:inherit; background:linear-gradient(90deg,var(--brand-dark),var(--brand)); transition:width var(--motion-spatial) var(--ease-out); }
  .day-progress-weeks{ display:grid; grid-template-columns:7fr 7fr 7fr 7fr 2fr; margin-top:6px; font-size:10.5px; color:var(--ink-400); text-align:center; }
  .day-progress-weeks span{ display:block; }
  .day-progress-weeks small{ display:block; margin-top:1px; font-size:9px; color:var(--ink-300); }
  @media(max-width:420px){ .day-progress-copy{ align-items:flex-start; flex-direction:column; gap:2px; } }
  .week-cell{ flex:1; border:none; border-radius:9px; padding:8px 4px 7px; background:#F2F4F6; text-align:center; transition:background var(--motion-short) var(--ease-out), transform var(--motion-press) var(--ease-out); }
  .week-cell:active{ transform:scale(.96); }
  .wc-label{ font-size:10.5px; font-weight:800; color:var(--ink-400); display:block; }
  .wc-state{ font-size:11px; font-weight:700; color:var(--ink-300); display:block; margin-top:2px; }
  .week-cell.doing{ background:var(--fix-light); }
  .week-cell.doing .wc-label,.week-cell.doing .wc-state{ color:#B6790C; }
  .week-cell.done{ background:var(--scale-light); }
  .week-cell.done .wc-label,.week-cell.done .wc-state{ color:#0B8F55; }
  .week-cell.current{ box-shadow:inset 0 0 0 2px var(--brand); }

  .empty-state{ background:var(--bg-card); border:1.5px dashed var(--line); border-radius:var(--radius-lg); padding:38px 24px; text-align:center; }
  .es-title{ font-weight:800; font-size:15.5px; margin-bottom:6px; }
  .es-sub{ font-size:13.5px; color:var(--ink-500); margin-bottom:18px; }
  .es-actions{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }

  #toast{ position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px); background:var(--ink-900); color:#fff; font-size:13.5px; font-weight:600; padding:12px 18px; border-radius:12px; box-shadow:var(--shadow-pop); opacity:0; pointer-events:none; transition:opacity var(--motion-short) var(--ease-out), transform var(--motion-short) var(--ease-out); z-index:90; }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* modal */
  #modal-layer{ position:fixed; inset:0; background:rgba(15,23,42,.42); display:none; align-items:center; justify-content:center; padding:20px; z-index:100; opacity:0; transition:opacity var(--motion-short) var(--ease-out); }
  #modal-layer.show,#modal-layer.is-closing{ display:flex; }
  #modal-layer.show{ opacity:1; }
  #modal-layer.client-info-modal .modal{ max-width:460px; }
  #modal-layer.client-info-modal #modal-body{ white-space:normal; }
  .client-info-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin:6px 0 18px; }
  .client-info-item{ padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:#FAFBFC; }
  .client-info-label{ display:block; color:var(--ink-400); font-size:11px; margin-bottom:4px; }
  .client-info-value{ display:block; color:var(--ink-700); font-size:13px; font-weight:700; word-break:break-word; }
  .client-status-table{ display:grid; gap:6px; max-height:420px; overflow:auto; margin:6px 0 18px; }
  .keyword-result-table{ width:100%; border-collapse:separate; border-spacing:0; overflow:hidden; border:1px solid var(--line); border-radius:14px; background:#fff; }
  .keyword-result-table th{ padding:13px 16px; background:#F7F9FC; color:var(--ink-400); font-size:11px; font-weight:800; text-align:right; border-bottom:1px solid var(--line); }
  .keyword-result-table th:first-child,.keyword-result-table td:first-child{ text-align:left; }
  .keyword-result-table td{ padding:13px 16px; color:var(--ink-700); font-size:13px; text-align:right; border-bottom:1px solid #F0F2F5; font-variant-numeric:tabular-nums; }
  .keyword-result-table tbody tr:last-child td{ border-bottom:0; }
  .keyword-result-table tbody tr:hover{ background:#FAFCFF; }
  .datalab-trend-card{margin-top:18px;padding:18px;border:1px solid var(--line);border-radius:16px;background:#fff}
  .datalab-trend-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .datalab-trend-head strong{font-size:15px}.datalab-trend-head span{font-size:11px;color:var(--ink-400)}
  .datalab-chart{display:block;width:100%;height:180px;background:linear-gradient(to bottom,transparent 49%,#eef2f7 50%,transparent 51%);overflow:visible}
  .datalab-line{fill:none;stroke:#2f7df4;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:var(--datalab-line-length,none);transition:stroke-dashoffset var(--motion-spatial) var(--ease-out)}
  .datalab-dot{fill:#fff;stroke:#2f7df4;stroke-width:2;transition:r var(--motion-short) var(--ease-out),fill var(--motion-short) var(--ease-out)}.datalab-axis{display:flex;justify-content:space-between;color:var(--ink-500);font-size:11px;font-weight:650;margin-top:8px;font-variant-numeric:tabular-nums}
  .datalab-note{margin-top:12px;color:var(--ink-500);font-size:11.5px;line-height:1.55}
  .datalab-chart-wrap{position:relative}.datalab-chart-tooltip{position:absolute;z-index:4;display:none;pointer-events:none;padding:9px 11px;border-radius:10px;background:rgba(25,31,40,.94);color:#fff;font-size:12px;font-weight:700;line-height:1.45;box-shadow:var(--shadow-pop);white-space:nowrap}.datalab-hit{fill:transparent;stroke:transparent;cursor:pointer;transition:r var(--motion-short) var(--ease-out)}.datalab-hit:focus{outline:none}.datalab-hit.is-active+.datalab-dot{r:5px;fill:var(--brand)}
  .keyword-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 16px}
  .keyword-summary-card{padding:15px 16px;border:1px solid var(--line);border-radius:14px;background:#fff;min-width:0}
  .keyword-summary-card .metric-label{display:block;color:var(--ink-700);font-size:12px;font-weight:800;margin-bottom:3px}
  .keyword-summary-card .metric-context{display:block;color:var(--ink-400);font-size:10px;font-weight:650;margin-bottom:10px}
  .keyword-summary-card .metric-number{display:flex;align-items:baseline;gap:2px;min-width:0;white-space:nowrap}
  .keyword-summary-card .metric-value{font-size:22px;letter-spacing:-.035em;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
  .keyword-summary-card .metric-unit{font-size:12px;color:var(--ink-500);font-weight:750;margin-left:2px}
  .keyword-summary-card .metric-breakdown{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;color:var(--ink-500);font-size:10px;font-weight:700}
  .keyword-summary-card .metric-breakdown b{padding:4px 7px;border-radius:999px;background:#F2F6FC;color:var(--ink-600);font-weight:750}
  .period-volume-table{border:1px solid var(--line);border-radius:14px;background:#fff}
  .period-volume-table table{width:100%;border-collapse:separate;border-spacing:0}
  .period-volume-table thead th{position:sticky;top:0;z-index:1;padding:12px 16px;background:#F6F8FB;color:var(--ink-500);font-size:11px;font-weight:800;border-bottom:1px solid var(--line)}
  .period-volume-table tbody td{padding:12px 16px;border-bottom:1px solid #EEF1F5;color:var(--ink-700);font-size:13px;font-variant-numeric:tabular-nums}
  .period-volume-table tbody tr:nth-child(even){background:#FAFBFD}.period-volume-table tbody tr:hover{background:#F3F7FF}.period-volume-table tbody tr:last-child td{border-bottom:0}
  .period-index{color:var(--ink-700);font-weight:750}.period-index-badge{display:inline-block;min-width:46px;padding:4px 8px;border-radius:999px;background:#EAF2FF;color:#1769D2;font-size:11px;font-weight:800;text-align:center}
  #naver-keywords{min-height:48px;height:48px;resize:none}
  @media(max-width:640px){.keyword-summary{grid-template-columns:repeat(2,1fr)}}
  .client-status-row{ display:grid; grid-template-columns:minmax(0,1.4fr) .9fr .9fr .8fr; gap:8px; align-items:center; padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; font-size:12px; }
  .client-status-row.season{ background:#FFF7E8; border-color:#F4C36A; }
  .client-status-row.complete{ background:#ECFDF5; border-color:#6EE7B7; }
  .client-status-row.overdue{ background:#FFF1F2; border-color:#FDA4AF; }
  .client-status-row button{ border:0; background:transparent; color:var(--brand-dark); font-weight:800; text-align:left; padding:0; cursor:pointer; }
  .client-status-head{ color:var(--ink-400); font-size:10.5px; font-weight:700; }
  .client-status-badge{ font-size:10.5px; font-weight:800; }
  @media(max-width:560px){ .client-status-row{ grid-template-columns:1.3fr .9fr .9fr; } .client-status-row .client-status-badge{ grid-column:1 / -1; } }
  @media(max-width:520px){ .client-info-grid{ grid-template-columns:1fr; } }
  #renewal-modal{ position:fixed; inset:0; background:rgba(15,23,42,.42); display:none; align-items:center; justify-content:center; padding:20px; z-index:105; }
  #renewal-modal.show{ display:flex; }
  #renewal-modal.show .modal{ opacity:1; transform:translateY(0) scale(1); }
  #renewal-set-options{ display:grid; gap:8px; margin:0 0 18px; }
  #renewal-set-options button{ border:1px solid var(--line); background:#fff; border-radius:10px; padding:11px 12px; text-align:left; font-weight:700; }
  #renewal-set-options button.active{ border-color:var(--brand); background:var(--brand-light); color:var(--brand-dark); }
  .modal{ background:#fff; border-radius:18px; padding:24px 22px 18px; max-width:360px; width:100%; box-shadow:var(--shadow-pop); opacity:0; transform:translateY(10px) scale(.97); transform-origin:var(--motion-origin-x,50%) var(--motion-origin-y,50%); transition:opacity var(--motion-short) var(--ease-out),transform var(--motion-short) var(--ease-spring); }
  .modal-layer.show .modal{ opacity:1; transform:translateY(0) scale(1); }
  .modal-layer.is-closing .modal{ opacity:0; transform:translateY(6px) scale(.98); }
  .tab-content-enter{ animation:tab-content-enter var(--motion-short) var(--ease-out); }
  @keyframes tab-content-enter{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }
  .modal h3{ margin:0 0 8px; font-size:16.5px; }
  .modal p{ margin:0 0 20px; font-size:13.5px; color:var(--ink-600); line-height:1.6; }
  .modal-actions{ display:flex; gap:8px; justify-content:flex-end; }

  /* forms */
  .form-card{ background:var(--bg-card); border-radius:var(--radius-lg); box-shadow:var(--shadow-card); overflow:hidden; }
  .fsection{ padding:24px; border-bottom:1px solid var(--line); }
  .fsection:last-of-type{ border-bottom:none; }
  .fsec-num{ font-size:11.5px; font-weight:800; color:var(--brand); letter-spacing:.06em; margin-bottom:4px; }
  .fsec-title{ font-size:16px; font-weight:800; margin:0 0 4px; }
  .fsec-hint{ font-size:12.5px; color:var(--ink-400); margin:0 0 14px; }
  .revenue-form-section{ background:linear-gradient(180deg,#F8FBFF,#fff); }
  .optional-label{ display:inline-flex; align-items:center; margin-left:6px; padding:2px 7px; border-radius:999px; background:var(--brand-light); color:var(--brand-dark); font-size:10.5px; font-weight:800; vertical-align:2px; }
  .revenue-auto{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; padding:12px 14px; border:1px solid #DCE8FB; border-radius:11px; background:#F5F9FF; color:var(--ink-600); font-size:12.5px; }
  .revenue-auto strong{ color:var(--brand-dark); font-size:14px; }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:12.5px; font-weight:700; color:var(--ink-600); margin-bottom:6px; }
  .field input[type=text],.field input[type=date],.field textarea,.field select{ width:100%; border:1px solid var(--line); border-radius:10px; padding:11px 13px; font-size:14px; color:var(--ink-900); background:#FAFBFC; resize:vertical; }
  .field input::placeholder,.field textarea::placeholder{ color:var(--ink-300); }
  .two-col{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media(max-width:640px){ .two-col{ grid-template-columns:1fr; } }
  .form-actions{ display:flex; justify-content:flex-end; gap:10px; padding:20px 24px 24px; }

  .seg{ display:inline-flex; background:#F2F4F6; border-radius:11px; padding:3px; }
  .seg button{ border:none; background:transparent; padding:9px 16px; font-size:13px; font-weight:700; border-radius:9px; color:var(--ink-500); }
  .seg button.active{ background:#fff; color:var(--ink-900); box-shadow:0 1px 4px rgba(15,23,42,.1); }

<script>
(function(){
  "use strict";

  /* ============ 저장소 (Upstash Redis via /api/data) ============ */
  var workspaceMode = sessionStorage.getItem('rs:workspace-mode') === 'demo' ? 'demo' : 'staff';
  var demoWorkspace = null;
  var sessionDraft = null;
  var sessionGeneration = 0;
  var sessionExpiryInFlight = false;
  var loginInFlight = null;
  function isDemoMode(){ return workspaceMode === 'demo'; }
  function ensureDemoWorkspace(){
    if (!demoWorkspace) demoWorkspace = DemoData.loadDemoWorkspace(localStorage, new Date());
    return demoWorkspace;
  }
  function cloneDemoValue(value){
    return value === undefined ? null : JSON.parse(JSON.stringify(value));
  }

  function captureReportDraft(){
    if(state.view!=="edit" || !app.querySelector(".form-card[data-report-type]")) return;
    var base=Object.assign({},state.editingBase||{}), field=function(id){ var input=document.getElementById(id); return input?input.value:""; };
    base.type=app.querySelector(".form-card").getAttribute("data-report-type");
    base.client=field("f-client"); base.period=field("f-period"); base.goal=field("f-goal");
    base.channels=collectChannels();
    if(base.type==="weekly"){
      base.external=field("f-external"); base.tests=collectRows("rows-tests"); base.results=collectRows("rows-results");
      base.next_week=collectRows("rows-nextweek"); base.deliveryMemo=field("f-delivery-memo");
      base.revenue=Object.assign({},base.revenue||{},{weekly:field("f-revenue-weekly")});
    } else {
      base.actions_done=collectRows("rows-actions"); base.facts=collectRows("rows-facts");
      base.interpretations=collectRows("rows-interps"); base.uncertain=field("f-uncertain");
      base.next={keep:collectRows("rows-keep"),fix:collectRows("rows-fix"),stop:collectRows("rows-stop"),scale:collectRows("rows-scale")};
      base.memo=field("f-memo"); base.revenue=Object.assign({},base.revenue||{},{previousMonth:field("f-revenue-previous"),monthlyOverride:field("f-revenue-override")});
    }
    state.editingBase=base;
  }

  function captureVisibleControls(){
    return Array.prototype.map.call(app.querySelectorAll('input, textarea, select, [contenteditable="true"]'),function(field,index){
      return {key:field.id?"id:"+field.id:"position:"+index,value:field.value,checked:field.checked,selectedIndex:field.selectedIndex,text:field.textContent,contentEditable:field.getAttribute("contenteditable")==="true"};
    });
  }

  function restoreVisibleControls(fields){
    var controls=app.querySelectorAll('input, textarea, select, [contenteditable="true"]');
    (fields||[]).forEach(function(field){
      var input=field.key.indexOf("id:")===0?document.getElementById(field.key.slice(3)):controls[Number(field.key.slice(9))];
      if(!input) return;
      if(field.contentEditable) input.textContent=field.text;
      else input.value=field.value;
      if(typeof field.checked==="boolean") input.checked=field.checked;
      if(typeof field.selectedIndex==="number"&&input.tagName==="SELECT") input.selectedIndex=field.selectedIndex;
    });
  }

  function preserveVisibleDrafts(){
    syncChecklistSetEditor();
    captureReportDraft();
    if(state.currentContract&&document.getElementById("contract-signature")) state.currentContract=collectContractFromForm(state.currentContract);
    sessionDraft={
      view:state.view,
      editingClient:state.editingClient,
      editingBase:state.editingBase,
      currentContract:state.currentContract,
      fields:captureVisibleControls(),
      activeButtons:Array.prototype.map.call(app.querySelectorAll('button[data-contract], button[data-status], button[data-type], button[data-mode]'),function(button,index){
        return button.classList.contains('active') ? {id:button.id,index:index} : null;
      }).filter(Boolean),
      overlays:captureProtectedOverlays()
    };
  }

  function captureProtectedOverlays(){

  function bindDataLabPointTooltips(root,width,height){
    if(!root)return;
    var tooltip=root.querySelector('.datalab-chart-tooltip'),hits=Array.from(root.querySelectorAll('.datalab-hit'));
    if(!tooltip)return;
    var activeHit=null;
    function show(hit){
      hits.forEach(function(point){if(point!==hit)point.classList.remove('is-active');});
      activeHit=hit;
      hit.classList.add('is-active');
      tooltip.innerHTML=esc(hit.dataset.period)+'<br>'+esc(hit.dataset.volume)+'회';
      tooltip.style.display='block';
      var x=Math.max(2,Math.min(98,Number(hit.getAttribute('cx'))/width*100));
      var y=Math.max(2,Math.min(98,Number(hit.getAttribute('cy'))/height*100));
      tooltip.style.left=x+'%';tooltip.style.top=y+'%';
      tooltip.style.transform='translate('+(x<18?'0':x>82?'-100%':'-50%')+','+(y<28?'16px':'calc(-100% - 14px)')+')';
    }
    function dismiss(){
      hits.forEach(function(point){point.classList.remove('is-active');});
      activeHit=null;
      tooltip.style.display='none';
    }
    function hide(hit,restoreFocused){
      hit.classList.remove('is-active');
      if(activeHit!==hit)return;
      var focused=restoreFocused&&hits.find(function(point){return document.activeElement===point;});
      if(focused){show(focused);return;}
      activeHit=null;
      tooltip.style.display='none';
    }
    hits.forEach(function(hit){
      var showHit=function(){show(hit);};
      hit.addEventListener('pointerenter',showHit);
      hit.addEventListener('pointerleave',function(){hide(hit,true);});
      hit.addEventListener('mouseenter',showHit);
      hit.addEventListener('mouseleave',function(){hide(hit,true);});
      hit.addEventListener('touchstart',showHit,{passive:true});
      hit.addEventListener('click',showHit);
      hit.addEventListener('focus',showHit);
      hit.addEventListener('blur',function(){hide(hit,false);});
      hit.addEventListener('keydown',function(event){
        if(event.key==='Enter'||event.key===' '){event.preventDefault();show(hit);}
        if(event.key==='Escape'){event.preventDefault();hit.blur();dismiss();}
      });
    });
  }

  function queuePublicGuideSave(guide){
    clearTimeout(publicGuideSaveTimer);
    if(publicGuideSubmitting){ publicGuideSavePending=true; return; }
    var revision=++publicGuideRevision;
    setGuideSaveStatus("saving","저장 대기 중…",null);
    publicGuideSaveTimer=setTimeout(function(){ persistPublicGuideDraft(guide,revision); },500);
  }
  async function persistPublicGuideDraft(guide,revision){
    clearTimeout(publicGuideSaveTimer);
    if(publicGuideSubmitting){ publicGuideSavePending=true; return false; }
    var saveRevision=revision||++publicGuideRevision;
    setGuideSaveStatus("saving","저장 중…",null);
    var saved=await savePublicGuide(guide,false);
    if(saveRevision!==publicGuideRevision) return saved;
    if(saved){
      setGuideSaveStatus("saved","서버에 저장되었습니다",null);
    }else{
      setGuideSaveStatus("failed","서버 저장에 실패했습니다 · 이 기기에 임시 보관됨",function(){ persistPublicGuideDraft(guide,++publicGuideRevision); });
    }
    return saved;
  }
  function submitPublicGuide(guide){
    return withPendingAction("guide:submit:"+guide.id,async function(){
    if(publicGuideSubmitting) return false;
    clearTimeout(publicGuideSaveTimer);
    ++publicGuideRevision;
    publicGuideSubmitting=true;
    publicGuideSavePending=false;
    var submit=document.getElementById("guide-submit");
    if(submit){ submit.disabled=true; submit.textContent="제출 중…"; }
    app.querySelectorAll("[data-guide-field],#guide-prev,#guide-next").forEach(function(control){ control.disabled=true; });
    setGuideSaveStatus("saving","제출 내용을 저장 중…",null);
    try{
    var saved=await savePublicGuide(guide,true);
    while(saved&&publicGuideSavePending){
      publicGuideSavePending=false;
      saved=await savePublicGuide(guide,false);
    }
    if(!saved){
      setGuideSaveStatus("failed","저장에 실패했습니다",function(){ submitPublicGuide(guide); });
      return;
    }
    app.innerHTML=renderGuideComplete(guide);
    var edit=document.getElementById("guide-edit-answers");
    if(edit) edit.addEventListener("click",function(){ delete guide._submitIdempotencyKey; mountPublicGuide(guide); });
    }finally{
      publicGuideSubmitting=false;
      if(submit&&submit.isConnected!==false){ submit.disabled=false; submit.textContent="제출하기"; }
      app.querySelectorAll("[data-guide-field],#guide-prev,#guide-next").forEach(function(control){ control.disabled=false; });
    }
    });
  }
  function bindPublicGuide(guide){
    app.querySelectorAll("[data-guide-field]").forEach(function(field){
      field.addEventListener("input",function(){
        if(field.type==="radio"&&!field.checked) return;
        guide.answers[field.getAttribute("data-guide-field")]=field.value;
        queuePublicGuideSave(guide);
      });
    });
    var previous=document.getElementById("guide-prev");
    var next=document.getElementById("guide-next");
    if(previous) previous.addEventListener("click",function(){
      persistPublicGuideDraft(guide,++publicGuideRevision);
      publicGuideSection=Math.max(0,publicGuideSection-1); syncPublicGuideSection();
    });
    if(next) next.addEventListener("click",function(){
      persistPublicGuideDraft(guide,++publicGuideRevision);
      publicGuideSection=Math.min(2,publicGuideSection+1); syncPublicGuideSection();
    });
    var form=document.getElementById("public-guide-form");
    if(form) form.addEventListener("submit",function(event){ event.preventDefault(); submitPublicGuide(guide); });
    syncPublicGuideSection();
  }
  function mountPublicGuide(guide){
    clearTimeout(publicGuideSaveTimer);
    publicGuideSection=0;
    app.innerHTML=renderPublicGuide(guide);
    bindPublicGuide(guide);
  }

  async function loadPublicGuidePage(publicGuideId){
    if(!/^guide_[A-Za-z0-9_-]{24,}$/.test(publicGuideId||"")){
      app.innerHTML=renderPublicGuideUnavailable("missing");
      return "missing";
    }
    app.innerHTML='<div style="padding:60px;text-align:center;color:#8B95A1;">안내문을 불러오는 중…</div>';
    var result;
    try{ result=(typeof storageBackend!=="undefined"&&storageBackend.getPublicGuide) ? {status:"found",value:await storageBackend.getPublicGuide(publicGuideId)} : await readS("guide:"+publicGuideId); }
    catch(e){ if(isSessionControlError(e)) return "session-expired"; result={status:e&&e.code==="not_found"?"missing":"error",error:e}; }
    var guide=result.status==="found"?result.value:null;
    if(result.status!=="found"||!guide||typeof guide!=="object"||guide.id!==publicGuideId||!guide.answers||typeof guide.answers!=="object"){
      if(result.status==="error"){
        try{
            var cached=JSON.parse(sessionStorage.getItem("guide-draft:"+publicGuideId)||localStorage.getItem("guide-draft:"+publicGuideId)||"null");
          if(cached&&cached.id===publicGuideId&&cached.answers&&typeof cached.answers==="object"){
            mountPublicGuide(cached);
            setGuideSaveStatus("failed","연결이 복구되면 서버에 동기화됩니다",function(){ loadPublicGuidePage(publicGuideId); });
            return "ready";
          }
        }catch(e){}
      }
      var stateName=result.status==="missing"?"missing":"error";
      app.innerHTML=renderPublicGuideUnavailable(stateName);
      if(stateName==="error"){
        var retry=document.getElementById("btn-retry-public-guide");
        if(retry) retry.onclick=function(){ loadPublicGuidePage(publicGuideId); };
      }
      return stateName;
    }
    if(guideStatus(guide)==="submitted"){
      app.innerHTML=renderGuideComplete(guide);
      var editPublicGuide=document.getElementById("guide-edit-answers");
      if(editPublicGuide) editPublicGuide.addEventListener("click",function(){ mountPublicGuide(guide); });
    }else{
      mountPublicGuide(guide);
    }
    return "ready";
  }

  async function init(){

    // 고객 안내문(?guide=ID)은 팀 로그인보다 먼저 불러오며 해당 안내문 데이터만 사용한다.

  /* ============ client helpers ============ */
  function blankClient(){
    return { name:"", industry:"", manager:"", contractType:"new", startDate:"", contractMonths:"3",
             fee:"", status:"active", memo:"", excludeWeekends:true, checklist:[], progress:{}, renewals:[] };
  }
  function contractEndKey(cl){
    if(!cl.startDate) return null;
    var d=new Date(cl.startDate);
    if(isNaN(d.getTime())) return null;
    var months=parseInt(cl.contractMonths,10); if(isNaN(months)||months<=0) months=3;
    d.setMonth(d.getMonth()+months);
    return d;
  }
  function isNewIn(cl, mk){
    if(!cl.startDate) return false;
    var d=new Date(cl.startDate);
    if(isNaN(d.getTime())) return false;
    return monthKey(d)===mk;
  }
  function renewalsIn(cl, mk){
    return (cl.renewals||[]).filter(function(r){ return r===mk; }).length;
  }
  function progressOf(cl, mk){
    var wk=weeksInMonth(mk), pm=(cl.progress||{})[mk]||{};
    var done=0;
    for(var i=1;i<=wk;i++){ if(pm[i]==="done") done++; }
    return { done:done, total:wk };
  }

          '<div class="progress-track"><div class="progress-fill" data-motion-width="dashboard:'+esc(mk)+':monthly-progress-fill" data-previous-value="'+pct+'" data-target-value="'+pct+'" style="width:'+pct+'%"></div></div>'+

    statCards.forEach(function(statCard){ statCard.style.cursor="pointer"; statCard.addEventListener("click",function(e){
      var statIndex=Array.prototype.indexOf.call(statCards,statCard);

        var label=complete?"재계약 완료":(overdue?"갱신 미진행":(season?"재계약 시즌":"진행 중"));

  async function cycleWeek(clientId, week){
    var cl=await getS("client:"+clientId);
    if(!cl){ showToast("업체 정보를 불러오지 못했습니다"); return; }
    cl.progress=cl.progress||{};
    cl.progress[state.month]=cl.progress[state.month]||{};
    var cur=cl.progress[state.month][week]||"none";
    var nextSt= cur==="none"?"doing": cur==="doing"?"done":"none";
    if(nextSt==="none") delete cl.progress[state.month][week];
    else cl.progress[state.month][week]=nextSt;
    await setS("client:"+clientId, cl);
    if(state.view==="dashboard") fillDashboard();
    else if(state.view==="clientDetail"){ state.currentClient=cl; render(); }
  }

  function blankContract(){
    return { id:"", clientId:"", clientName:"", contractType:"new", renewalCount:1, productType:"regular", productName:"", supplyPrice:"", paymentMethod:"card", businessNumber:"", contact:"", email:"", startDate:"", contractMonths:"3", fee:"", terms:"", baseTerms:"", internalMemo:"", owner:"", signerName:"", signatureDataUrl:"", createdAt:null, updatedAt:null };

  function newContractDraft(){
    var bytes=new Uint8Array(24);
    if(typeof crypto!=="undefined"&&crypto.getRandomValues) crypto.getRandomValues(bytes);
    else for(var i=0;i<bytes.length;i++) bytes[i]=Math.floor(Math.random()*256);
    var token=Array.prototype.map.call(bytes,function(byte){return byte.toString(16).padStart(2,"0");}).join("");
    var contract=blankContract();
    contract.id="contract_"+token;
    contract.clientId=uid("cl");
    contract.createdAt=Date.now();
    contract.updatedAt=contract.createdAt;
    return contract;
  }
  function publicContractPayload(contract){

    var out={};
    allowed.forEach(function(key){ if(source[key]!==undefined) out[key]=source[key]; });
    return out;

      return;

    state.currentContract=contract;

    bindSignaturePad(document.getElementById("contract-signature"));
    restoreSignatureToCanvas(document.getElementById("contract-signature"), contract.signatureDataUrl);
    var submit=document.getElementById("btn-submit-public-contract");
    if(submit) submit.onclick=function(){
      submit.disabled=true; submit.textContent="제출 중…";
      var pending=withPendingAction("contract:submit:"+contract.id,async function(){
      var payload=collectContractFromForm(contract);
      var saved=await mutatePublicContract(contract.id,payload,true);
      if(!saved){ showToast("계약서 제출에 실패했습니다"); return; }
      state.currentContract=saved;
      app.innerHTML=renderPublicContract(saved);

      return pending;
    };
  }

  function bindSignaturePad(canvas){
    if(!canvas || !canvas.getContext) return;
    var ctx=canvas.getContext("2d"), drawing=false, last=null;
    canvas.dataset.signatureDirty=canvas.dataset.signatureDirty||"0";
    canvas.dataset.signatureCleared=canvas.dataset.signatureCleared||"0";
    ctx.lineWidth=3; ctx.lineCap="round"; ctx.strokeStyle="#191F28";
    function point(e){ var r=canvas.getBoundingClientRect(), t=e.touches&&e.touches[0]||e; return { x:(t.clientX-r.left)*(canvas.width/r.width), y:(t.clientY-r.top)*(canvas.height/r.height) }; }
    function start(e){ drawing=true; last=point(e); canvas.dataset.signatureDirty="1"; canvas.dataset.signatureCleared="0"; e.preventDefault&&e.preventDefault(); }
    function move(e){ if(!drawing) return; var p=point(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; e.preventDefault&&e.preventDefault(); }
    function end(){ drawing=false; last=null; }
    canvas.addEventListener("mousedown",start); canvas.addEventListener("mousemove",move); window.addEventListener("mouseup",end);
    canvas.addEventListener("touchstart",start,{passive:false}); canvas.addEventListener("touchmove",move,{passive:false}); canvas.addEventListener("touchend",end);
  }
  function restoreSignatureToCanvas(canvas,dataUrl){
    if(!canvas || !canvas.getContext || !dataUrl) return;
    var ctx=canvas.getContext("2d"), img=new Image();
    img.onload=function(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      canvas.dataset.signatureDirty="0";
      canvas.dataset.signatureCleared="0";
    };
    img.src=dataUrl;
  }
  function signatureValueFromCanvas(canvas,currentValue){
    if(!canvas || !canvas.toDataURL) return currentValue||"";
    if(canvas.dataset && canvas.dataset.signatureCleared==="1") return "";
    if(canvas.dataset && canvas.dataset.signatureDirty!=="1" && currentValue) return currentValue;
    return canvas.toDataURL("image/png");
  }

  async function issueGuideForClient(client){
    if(!client || !client.id) return null;
    var storedClient=await getS("client:"+client.id);
    if(!storedClient){
      storedClient=Object.assign({},client);
      var recovered=await setS("client:"+client.id,storedClient);
      if(!recovered) return null;
    }
    if(storedClient.guideId){
      client.guideId=storedClient.guideId;
      return await getS("guide:"+storedClient.guideId);
    }
    var reservation=await reserveGuideIssue(client.id);
    var guide=reservation&&reservation.guide&&reservation.guide.clientId===client.id?reservation.guide:null;
    if(!guide) return null;
    var reviewKey="guide-review:"+guide.id;
    var storedReview=await readS(reviewKey);
    if(storedReview.status==="error") return null;
    if(storedReview.status==="found"&&(
      !storedReview.value||typeof storedReview.value!=="object"||
      storedReview.value.guideId!==guide.id||storedReview.value.clientId!==guide.clientId||
      ["unreviewed","reviewing","reviewed"].indexOf(storedReview.value.status)<0||
      typeof storedReview.value.memo!=="string"
    )) return null;
    if(storedReview.status==="missing"){
      var reviewSaved=await setS(reviewKey,newGuideReview(guide));
      if(!reviewSaved) return null;
    }
    var linkedClient=Object.assign({},storedClient,{guideId:guide.id});
    var clientSaved=await setS("client:"+client.id,linkedClient);
    if(!clientSaved) return null;
    client.guideId=guide.id;
    return guide;
  }

  var _clientSaveQueue=Promise.resolve(), _clientSaveVersions={}, _clientSaveBaselines={}, _clientSaveNoteReconciliations={}, _saveFeedbackTokens=new WeakMap(), _dayNoteInputEditStates=new WeakMap();
  function copyClientForSave(client){ return JSON.parse(JSON.stringify(client)); }
  function clientIndexEntry(client){ return { id:client.id, name:client.name, contractType:client.contractType, renewalCount:client.renewalCount, startDate:client.startDate, status:client.status, updatedAt:client.updatedAt }; }
  function reconcileClientSave(client,error){
    var snapshot=error&&error.clientSaveReconciledSnapshot;
    if(!snapshot)return false;
    Object.keys(client).forEach(function(key){ delete client[key]; });
    Object.assign(client,copyClientForSave(snapshot));
    return true;
  }
  async function persistClientSnapshot(snapshot,baseline){
    var key="client:"+snapshot.id, prior=await readS(key);
    if(prior.status==="error"){
      var unavailableError=new Error("client prior state unavailable");
      if(baseline)unavailableError.clientSaveReconciledSnapshot=copyClientForSave(baseline);
      throw unavailableError;
    }
    var previous=prior.status==="found" ? prior.value : null, clientSaved=await setS(key,snapshot);
    if(!clientSaved){
      var clientError=new Error("client save failed");
      if(previous||baseline)clientError.clientSaveReconciledSnapshot=copyClientForSave(previous||baseline);
      throw clientError;
    }
    var index=(state.clients||[]).filter(function(item){ return item.id!==snapshot.id; });
    index.push(clientIndexEntry(snapshot));
    var clientIndexSaved=await setP("clients-index",index);
    if(!clientIndexSaved){
      var repaired=previous ? await setS(key,previous) : await delS(key);
      if(!repaired) throw new Error("client index save failed and client rollback failed");
      var indexError=new Error("client index save failed");
      if(previous||baseline)indexError.clientSaveReconciledSnapshot=copyClientForSave(previous||baseline);
      throw indexError;
    }
    return index;
  }
  async function saveClientWithFeedback(client,element){
    var options=arguments[2]||{}, token=element ? (_saveFeedbackTokens.get(element)||0)+1 : 0;
    if(element)_saveFeedbackTokens.set(element,token);
    var ownsFeedback=function(){ return !element||_saveFeedbackTokens.get(element)===token; };
    if(ownsFeedback())setAsyncVisualState(element,'saving');
    try{
      var outcome=await saveClientAndRefresh(client,Object.assign({},options,{refresh:false}));
      if(ownsFeedback()){
        if(outcome.isLatest) setAsyncVisualState(element,'saved');
        else setAsyncVisualState(element,'idle');
      }
      return outcome;
    }catch(error){
      if(error.clientSaveIsLatest!==false){
        if(ownsFeedback())setAsyncVisualState(element,'error');
        showToast('저장하지 못했습니다. 다시 시도해 주세요.');
      }else if(ownsFeedback())setAsyncVisualState(element,'idle');
      throw error;
    }
  }
  async function saveClientAndRefresh(cl,options){
    cl.updatedAt=Date.now();
    var clientId=cl.id;
    if(!_clientSaveBaselines[clientId]&&options&&options.rollbackSnapshot)_clientSaveBaselines[clientId]=copyClientForSave(options.rollbackSnapshot);
    if(options&&options.task3NoteReconciliation)_clientSaveNoteReconciliations[clientId]=options.task3NoteReconciliation;
    var baseline=_clientSaveBaselines[clientId], snapshot=copyClientForSave(cl), version=(_clientSaveVersions[clientId]||0)+1;
    _clientSaveVersions[clientId]=version;
    var operation=_clientSaveQueue.catch(function(){}).then(function(){ return persistClientSnapshot(snapshot,baseline); });
    _clientSaveQueue=operation.catch(function(){});
    try{
      var index=await operation, isLatest=_clientSaveVersions[clientId]===version;
      if(isLatest){
        delete _clientSaveBaselines[clientId];
        delete _clientSaveNoteReconciliations[clientId];
        state.clients=index;
        state.currentClient=cl;
        if(state.view==="clientDetail" && !(options&&options.refresh===false)) render();
      }
      return {version:version,isLatest:isLatest};
    }catch(error){
      error.clientSaveVersion=version;
      error.clientSaveIsLatest=_clientSaveVersions[clientId]===version;
      if(error.clientSaveIsLatest){
        if(!error.clientSaveReconciledSnapshot&&baseline)error.clientSaveReconciledSnapshot=copyClientForSave(baseline);
        if(_clientSaveNoteReconciliations[clientId])error.clientSaveTask3NoteReconciliation=_clientSaveNoteReconciliations[clientId];
        delete _clientSaveBaselines[clientId];
        delete _clientSaveNoteReconciliations[clientId];
      }
      throw error;
    }
  }

      };
    });

    confirmRenewal.onclick=function(){
      confirmRenewal.disabled=true;
      var pending=withPendingAction("client:renew:"+client.id,async function(){
      var startDate=document.getElementById("renewal-start-date").value;
      if(!isMondayDate(startDate)){
        showToast("재계약 시작일은 월요일만 선택할 수 있습니다.");
        return;
      }
      var selectedSetId=state.renewalSelectedSetId||"";

      var renewed=buildRenewalClient(client,startDate,selectedSet);

      var mutation=typeof renewClientMutation==="function" ? await renewClientMutation(renewed,index) : null;
      if(typeof renewClientMutation!=="function"){
        var saved=await setS("client:"+client.id,renewed);
        if(!saved){ showToast("재계약 저장에 실패했습니다"); return; }
        var indexSaved=await setP("clients-index",index);
        if(!indexSaved){ showToast("\uC7AC\uACC4\uC57D \uC800\uC7A5\uC5D0 \uC2E4\uD328\uD588\uC2B5\uB2C8\uB2E4"); return; }
      } else if(!mutation){ showToast("재계약 저장에 실패했습니다"); return; }
      state.currentClient=renewed;
      state.clients=index;
      close();
      renderClientWorkspace(renewed);
      });
      pending.finally(function(){ confirmRenewal.disabled=false; });
      return pending;
    };
  }

  app.addEventListener("click", function(e){ editDelegated(e); });

  function editDelegated(e){
    var typeBtn=e.target.closest(".type-toggle [data-type]");
    if(typeBtn){
      if(typeBtn.classList.contains("active")) return;
      var nt=typeBtn.getAttribute("data-type");
      var keep={ type:nt };
      var ce=document.getElementById("f-client"); if(ce) keep.client=ce.value;
      var pe=document.getElementById("f-period"); if(pe) keep.period=pe.value;
      var ge=document.getElementById("f-goal"); if(ge) keep.goal=ge.value;
      if(document.getElementById("channels-container")) keep.channels=collectChannels();
      var b=state.editingBase||{};
      keep.clientId=b.clientId; keep.id=b.id; keep.createdAt=b.createdAt;
      if(b.revenue&&typeof b.revenue==="object") keep.revenue=Object.assign({},b.revenue);
      var weeklyRevenue=document.getElementById("f-revenue-weekly");
      var previousRevenue=document.getElementById("f-revenue-previous");
      var overrideRevenue=document.getElementById("f-revenue-override");
      if(weeklyRevenue||previousRevenue||overrideRevenue){
        keep.revenue=keep.revenue||{};
        if(weeklyRevenue) keep.revenue.weekly=weeklyRevenue.value;
        if(previousRevenue) keep.revenue.previousMonth=previousRevenue.value;
        if(overrideRevenue) keep.revenue.monthlyOverride=overrideRevenue.value;
      }
      state.editingBase=keep; renderEdit(keep); return;
    }
    var qb=e.target.closest("[data-quickchannel]");
    if(qb){
      var cont=document.getElementById("channels-container");
      var nm=qb.getAttribute("data-quickchannel");
      if(nm){
        var dup=null;
        cont.querySelectorAll(".channel-name").forEach(function(i){ if(!dup&&i.value.trim()===nm) dup=i; });
        if(dup){ dup.focus(); showToast("이미 추가된 채널입니다"); return; }
      }
      cont.insertAdjacentHTML("beforeend", channelBlockTpl({name:nm}));
      var last=cont.lastElementChild.querySelector(".channel-name");
      if(!nm) last.focus(); else qb.remove();
      return;
    }
    var rc=e.target.closest('[data-action="remove-channel"]');
    if(rc){
      var c2=document.getElementById("channels-container");
      if(c2.children.length>1) rc.closest(".channel-block").remove();
      else showToast("최소 1개 채널은 유지해야 합니다");
      return;
    }
    var am=e.target.closest('[data-action="add-metric"]');
    if(am){ am.closest(".channel-block").querySelector(".channel-metrics").insertAdjacentHTML("beforeend", metricRowTpl({})); return; }
    var rr=e.target.closest('[data-action="remove-row"]');
    if(rr){
      var row=rr.closest(".row, .metric-row"), par=row.parentElement;
      if(par.children.length>1) row.remove();
      else showToast("최소 1개 항목은 유지해야 합니다");
      return;
    }
    var ab=e.target.closest("[data-add]");
    if(ab){
      var t=document.getElementById(ab.getAttribute("data-add"));
      t.insertAdjacentHTML("beforeend", rowTpl("내용을 입력하세요",""));
      return;
    }
  }

  function collectRows(id){
    var c=document.getElementById(id), out=[];
    if(!c) return out;
    c.querySelectorAll(".row-input").forEach(function(i){ var v=i.value.trim(); if(v) out.push(v); });
    return out;
  }
  function collectChannels(){
    var out=[];
    document.querySelectorAll("#channels-container .channel-block").forEach(function(b){
      var name=b.querySelector(".channel-name").value.trim(), ms=[];
      b.querySelectorAll(".metric-row").forEach(function(r){
        var label=r.querySelector(".m-label").value.trim();
        var value=r.querySelector(".m-value").value.trim();
        if(!label&&!value) return;
        ms.push({ label:label, value:value,
          unit:r.querySelector(".m-unit").value.trim(),
          compareValue:r.querySelector(".m-compare").value.trim(),
          compareLabel:r.querySelector(".m-comparelabel").value.trim() });
      });
      if(!name&&ms.length===0) return;
      out.push({ name:name||"미지정 채널", metrics:ms });
    });
    return out;
  }

  async function saveReport(){
    var ce=document.getElementById("f-client"), pe=document.getElementById("f-period");
    if(!ce||!pe){ showToast("폼을 다시 불러온 뒤 시도하십시오"); return; }
    var client=ce.value.trim(), period=pe.value.trim();
    if(!client||!period){ showToast("업체명과 기간을 입력하십시오"); return; }

    var type=document.querySelector(".form-card").getAttribute("data-report-type");
    var revenue={}, hasRevenueInputs=false, revenueFields=type==="weekly"
      ? [{ id:"f-revenue-weekly", key:"weekly" }]
      : [{ id:"f-revenue-previous", key:"previousMonth" }, { id:"f-revenue-override", key:"monthlyOverride" }];
    for(var revenueIndex=0;revenueIndex<revenueFields.length;revenueIndex++){
      var revenueField=revenueFields[revenueIndex], revenueInput=document.getElementById(revenueField.id);
      if(!revenueInput) continue;
      hasRevenueInputs=true;
      var revenueRaw=revenueInput.value, revenueValue=parseRevenueWon(revenueRaw);
      revenueInput.setCustomValidity("");
      if(revenueRaw.trim()!=="" && revenueValue===null){
        revenueInput.setCustomValidity("0 \uC774\uC0C1\uC758 \uC6D0 \uB2E8\uC704 \uC22B\uC790\uB85C \uC785\uB825\uD574 \uC8FC\uC138\uC694.");
        revenueInput.reportValidity();
        revenueInput.focus();
        return;
      }
      revenue[revenueField.key]=revenueValue;
    }

    var btn=document.getElementById("btn-save");
    btn.disabled=true; btn.textContent="저장 중…";
    try{
      var b=state.editingBase||{};
      var reportClientId=b.clientId || (state.currentClient?state.currentClient.id:null);
      if(type==="monthly"){
        var reportMonth=reportMonthKey(period);
        var weeklySnapshot=reportClientId&&reportMonth ? revenueSummary(state.reports,reportClientId,reportMonth).weeklyTotal : null;
        if(weeklySnapshot!==null) revenue.weeklyTotal=weeklySnapshot;
        else {
          var savedWeeklySnapshot=parseRevenueWon(b.revenue&&b.revenue.weeklyTotal);
          if(savedWeeklySnapshot!==null) revenue.weeklyTotal=savedWeeklySnapshot;
        }
      }
      Object.keys(revenue).forEach(function(key){ if(revenue[key]===null) delete revenue[key]; });
      var rep={ type:type, client:client, period:period,
        clientId: reportClientId,
        goal:document.getElementById("f-goal").value.trim(),
        channels:collectChannels(), updatedAt:Date.now() };
      if(Object.keys(revenue).length) rep.revenue=revenue;
      else if(!hasRevenueInputs && b.revenue && typeof b.revenue==="object") rep.revenue=Object.assign({},b.revenue);

      if(type==="weekly"){
        rep.external=document.getElementById("f-external").value.trim();
        rep.tests=collectRows("rows-tests");
        rep.results=collectRows("rows-results");
        rep.next_week=collectRows("rows-nextweek");
        rep.deliveryMemo=document.getElementById("f-delivery-memo").value.trim();
      } else {
        rep.actions_done=collectRows("rows-actions");
        rep.facts=collectRows("rows-facts");
        rep.interpretations=collectRows("rows-interps");
        rep.uncertain=document.getElementById("f-uncertain").value.trim();
        rep.next={ keep:collectRows("rows-keep"), fix:collectRows("rows-fix"),
                   stop:collectRows("rows-stop"), scale:collectRows("rows-scale") };
        rep.memo=document.getElementById("f-memo").value.trim();
      }

      var id=b.id||publicId("rpt");
      rep.id=id; rep.createdAt=b.createdAt||Date.now();

      var ok=await setS("report:"+id, rep);
      if(!ok) throw new Error("save failed");

      var idx=state.reports.filter(function(r){ return r.id!==id; });
      var reportMeta={ id:id, clientId:rep.clientId, clientName:client, period:period, type:type, updatedAt:rep.updatedAt };
      if(rep.revenue) reportMeta.revenue=Object.assign({},rep.revenue);
      idx.push(reportMeta);
      state.reports=idx;
      await setP("reports-index", idx);

      state.currentReport=rep; state.summaryMode=false; state.view="report";
      showToast("리포트가 저장되었습니다"); render();
    }catch(err){
      console.error(err); showToast("저장에 실패했습니다. 다시 시도하십시오");
      btn.disabled=false; btn.textContent="리포트 저장";
    }
  }

  async function openReport(id){
    var r=await getS("report:"+id);
    if(!r){ showToast("리포트를 찾을 수 없습니다"); return; }
    r.type = r.type==="weekly"?"weekly":"monthly";
    state.currentReport=r; state.summaryMode=false; state.view="report"; render();
  }

  async function deleteReport(id){
    return withPendingAction("report:delete:"+id,async function(){
      try{
        var nextReports=state.reports.filter(function(r){ return r.id!==id; });
        if(typeof deleteReportMutation==="function"){
          if(!await deleteReportMutation(id,nextReports)) throw new Error("report delete failed");
        }else{
          if(!await delS("report:"+id)) throw new Error("report delete failed");
          if(!await setP("reports-index", nextReports)) throw new Error("report index delete failed");
        }
        state.reports=nextReports;
        showToast("리포트가 삭제되었습니다");
        if(state.currentReport&&state.currentReport.id===id) state.currentReport=null;
        state.view = state.currentClient ? "clientDetail" : "dashboard";
        render(); return true;
      }catch(error){ console.error(error); showToast("리포트 삭제에 실패했습니다. 다시 시도해 주세요."); return false; }
    });
  }

  function deltaChip(m){
    var d=computeDelta(m.value,m.compareValue);
    if(!d) return m.compareLabel?'<div class="mc-compare-only">'+esc(m.compareLabel)+'</div>':"";
    var arrow=d.dir==="up"?"▲":d.dir==="down"?"▼":"–";
    return '<div class="mc-delta '+d.dir+'">'+arrow+' '+Math.abs(d.pct).toFixed(1)+'% <span style="font-weight:600;opacity:.85;">'+esc(m.compareLabel||"비교")+'</span></div>';
  }

    return '<div class="metric-card"><div class="mc-label">'+esc(m.label||"지표")+'</div>'+
      '<div><span class="mc-value" data-count-to="'+(isNaN(n)?"":n)+'">'+(isNaN(n)?esc(m.value||"-"):"0")+'</span>'+
      '<span class="mc-unit">'+esc(m.unit||"")+'</span></div>'+deltaChip(m)+'</div>';

      '<div class="share-card"><div class="share-title">이 리포트 공유하기</div>'+
      '<div class="share-sub">이 링크를 전달하면 비밀번호 없이 리포트만 열람할 수 있습니다.</div>'+
      '<div class="share-box"><code>'+esc(link)+'</code><button data-copy="'+esc(link)+'">링크 복사</button></div></div></div>';
  }

  function paintReport(rep, pill, body, withToggle){
    var s=state.summaryMode;
    var ro = state.readOnly;
    app.innerHTML=
      '<div class="report-top">'+
        (ro?'<div class="brand"><span class="brand-mark"></span>리포트</div>':'<button class="back-btn" id="btn-back">←</button>')+
        '<div class="report-actions">'+
          (withToggle?('<div class="mode-toggle">'+
            '<button data-mode="full" class="'+(s?"":"active")+'">전체보기</button>'+
            '<button data-mode="summary" class="'+(s?"active":"")+'">요약보기</button></div>'):"")+
          (ro?"":'<button class="btn btn-plain btn-sm" id="btn-edit-report">수정</button>'+
               '<button class="btn btn-danger btn-sm" id="btn-del-report">삭제</button>')+
        '</div>'+
      '</div>'+
      '<div class="report-header fade-in">'+
        '<span class="status-pill">'+pill+'</span>'+
        '<h2 class="rh-client">'+esc(rep.client||"")+'</h2>'+
        '<p class="rh-period">'+esc(rep.period||"")+'</p>'+
        (rep.goal?('<div class="rh-goal-label">'+(rep.type==="weekly"?"이번 주 목표":"이번 달 목표")+'</div><div class="rh-goal">'+esc(rep.goal)+'</div>'):"")+
      '</div>'+body;

    var backEl = document.getElementById("btn-back");
    if (backEl) backEl.addEventListener("click", function(){
      state.view = state.currentClient ? "clientDetail" : "dashboard"; render();
    });
    var editEl = document.getElementById("btn-edit-report");
    if (editEl) editEl.addEventListener("click", function(){
      state.editingBase=rep; state.view="edit"; render();
    });
    var delEl = document.getElementById("btn-del-report");
    if (delEl) delEl.addEventListener("click", function(){
      confirmDialog("리포트를 삭제할까요?", (rep.period||"")+" 리포트가 삭제됩니다. 이 작업은 되돌릴 수 없습니다.", "삭제", function(){ deleteReport(rep.id); });
    });
    app.querySelectorAll(".mode-toggle button").forEach(function(b){
      b.addEventListener("click", function(){ state.summaryMode=b.getAttribute("data-mode")==="summary"; render(); });
    });
    app.querySelectorAll("[data-copy]").forEach(function(b){
      b.addEventListener("click", function(){ copyText(b.getAttribute("data-copy")); });
    });
    animateNumbers();
  }

  function animateNumbers(){
    var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    document.querySelectorAll(".mc-value[data-count-to]").forEach(function(el){
      var target=parseFloat(el.getAttribute("data-count-to"));
      if(isNaN(target)) return;
      if(reduce){ el.textContent=target.toLocaleString("ko-KR",{maximumFractionDigits:2}); return; }
      var t0=null, dur=520;
      function step(ts){
        if(!t0) t0=ts;
        var p=Math.min(1,(ts-t0)/dur), e=1-Math.pow(1-p,3);
        el.textContent=(target*e).toLocaleString("ko-KR",{maximumFractionDigits: target%1!==0?2:0});
        if(p<1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    });
  }

  init();
})();
</script>
</body>
</html>
